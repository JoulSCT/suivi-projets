function getRaFilteredTasks(){
  const all = getAllTasks();
  const raTasks = all.filter(t=>t.statut==='fait (R.A.)')
    .sort((a,b)=>{ const da=a.completedAt||a.echeance||'0000',db=b.completedAt||b.echeance||'0000'; return db.localeCompare(da); });
  const selYear = state.raYear || new Date().getFullYear().toString();
  if(selYear==='all') return raTasks;
  return raTasks.filter(t=>{ const y=(t.completedAt||t.echeance||'').slice(0,4); return y===selYear; });
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ showBanner('SheetJS non disponible. Vérifiez votre connexion.', 'error'); return; }
  const wb = XLSX.utils.book_new();

  /* ---- Sheet 1 : Toutes les tâches ---- */
  const allTasks = getAllTasks();
  const taskHeader = ['Projet', 'Sous-projet', 'Origine', 'Description', 'Responsable', 'Échéance', 'Statut', 'Date réalisation'];
  const taskRows = allTasks.map(t => {
    const p = getProject(t.projectId);
    const isChild = p && p.parentId;
    const parent = isChild ? getProject(p.parentId) : null;
    return [
      parent ? parent.name : (p ? p.name : ''),
      isChild ? (p ? p.name : '') : '',
      t.originLabel,
      t.description,
      t.responsable || '',
      t.echeance || '',
      t.statut,
      t.completedAt || ''
    ];
  });
  const wsAll = XLSX.utils.aoa_to_sheet([taskHeader, ...taskRows]);
  wsAll['!cols'] = [22,18,20,50,16,14,14,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, wsAll, 'Toutes les tâches');

  /* ---- Sheet 2 : Points de vigilance ---- */
  const vigHeader = ['Projet', 'Point de vigilance'];
  const vigRows = [];
  state.data.projects.forEach(p => {
    (p.vigilances||[]).forEach(v => {
      vigRows.push([getProjectPath(p.id), v.text]);
    });
  });
  if(vigRows.length > 0){
    const wsVig = XLSX.utils.aoa_to_sheet([vigHeader, ...vigRows]);
    wsVig['!cols'] = [{wch:28},{wch:80}];
    XLSX.utils.book_append_sheet(wb, wsVig, 'Vigilances');
  }

  /* ---- Sheet 3 : Rapport d'activités (Fait R.A.) ---- */
  const raTasks = getAllTasks().filter(t => t.statut === 'fait (R.A.)');
  if(raTasks.length > 0){
    const raHeader = ['Projet', 'Origine', 'Réalisation', 'Responsable', 'Date réalisation'];
    const raRows = raTasks
      .sort((a,b) => (b.completedAt||'').localeCompare(a.completedAt||''))
      .map(t => [t.projectPath, t.originLabel, t.description, t.responsable||'', t.completedAt||t.echeance||'']);
    const wsRa = XLSX.utils.aoa_to_sheet([raHeader, ...raRows]);
    wsRa['!cols'] = [{wch:28},{wch:20},{wch:55},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsRa, 'Rapport activités');
  }

  /* ---- Sheets par projet (top-level) ---- */
  state.data.projects.filter(p => !p.parentId).forEach(p => {
    const projTasks = getProjectTasks(p.id, true);
    if(projTasks.length === 0) return;
    const header = ['Axe', 'Origine', 'Description', 'Responsable', 'Échéance', 'Statut'];
    const rows = projTasks
      .sort((a,b) => (a.echeance||'9999').localeCompare(b.echeance||'9999'))
      .map(t => {
        const sub = t._subLabel || '';
        return [sub, t._origin, t.description, t.responsable||'', t.echeance||'', t.statut];
      });
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = [{wch:18},{wch:20},{wch:52},{wch:16},{wch:14},{wch:14}];
    // Truncate sheet name to 31 chars (Excel limit)
    const sheetName = p.name.slice(0,31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  const filename = 'suivi-projets-' + todayStr() + '.xlsx';
  XLSX.writeFile(wb, filename);
  stampExportTime();
  showBanner('Export Excel téléchargé.', 'success');
}

function mergeSeancesAndPagesInto(projectId, def){

      notes: pg.notes || '',
      source: pg.source === 'onenote' ? 'onenote' : 'manuel',
      createdAt: pg.createdAt || pg.date || todayStr(),
      taches: (Array.isArray(pg.taches) ? pg.taches : []).map(cleanTaskImport).filter(t=>t.description.trim())
    });
  });
}
function importNamePackage(pkg){
  (pkg.projects || []).forEach(def => {
    const proj = findOrCreateProjectByName(def.name, def, null);
    mergeSeancesAndPagesInto(proj.id, def);
    (def.subProjects || []).forEach(subDef => {
      const sub = findOrCreateProjectByName(subDef.name, subDef, proj.id);
      mergeSeancesAndPagesInto(sub.id, subDef);
    });
  });
}
function importFullBackup(pkg){
  const idMap = {};
  pkg.projects.forEach(p => { idMap[p.id] = uid(); });
  pkg.projects.forEach(p => {
    const newId = idMap[p.id];
    state.data.projects.push({
      id: newId, name: p.name || 'Projet importé', description: p.description || '',
      status: p.status || 'Actif',
      color: p.color || PROJECT_COLORS[state.data.projects.length % PROJECT_COLORS.length],
      parentId: p.parentId ? (idMap[p.parentId] || null) : null,
      createdAt: todayStr()
    });
    state.data.seances[newId] = ((pkg.seances && pkg.seances[p.id]) || []).map(s => ({
      id: uid(), date: s.date || todayStr(),
      participants: Array.isArray(s.participants) ? s.participants.map(String) : [],
      notes: s.notes || '',
      conclusions: (Array.isArray(s.conclusions) ? s.conclusions : []).map(String).filter(c=>c.trim()),
      taches: (Array.isArray(s.taches) ? s.taches : []).map(cleanTaskImport).filter(t=>t.description.trim())
    }));
    state.data.pages[newId] = ((pkg.pages && pkg.pages[p.id]) || []).map(pg => ({
      id: uid(), title: pg.title || 'Page', notes: pg.notes || '',
      source: pg.source === 'onenote' ? 'onenote' : 'manuel', createdAt: pg.createdAt || todayStr(),
      taches: (Array.isArray(pg.taches) ? pg.taches : []).map(cleanTaskImport).filter(t=>t.description.trim())
    }));
  });
}
function importPackage(pkg){
  if(!pkg || !Array.isArray(pkg.projects) || pkg.projects.length===0){
    throw new Error('format invalide : un tableau "projects" est attendu.');
  }
  const isFullBackup = pkg.seances && typeof pkg.seances === 'object' && !Array.isArray(pkg.seances);
  if(isFullBackup) importFullBackup(pkg);
  else importNamePackage(pkg);
}
function saveImportJson(){
  const raw = document.getElementById('ij-text').value;
  if(!raw || !raw.trim()){ return; }
  let pkg;
  try{
    pkg = JSON.parse(raw);
  }catch(e){
    showBanner('JSON invalide — vérifiez le format avant de réessayer.');
    return;
  }
  try{
    importPackage(pkg);
  }catch(e){
    showBanner('Import impossible : ' + e.message);
    return;
  }
  state.modal = null;
  state.view = 'dashboard'; state.currentProjectId = null;
  persistAndRender();
  showBanner('Import réussi.');
}

function normalizeHeader(h){
  return String(h||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}

function matchCol(headers, ...variants){
  for(const v of variants){
    const norm = normalizeHeader(v);
    const idx = headers.findIndex(h => normalizeHeader(h) === norm);
    if(idx >= 0) return idx;
  }
  return -1;
}

function importFromExcel(){
  const fileInput = document.getElementById('xl-file');
  if(!fileInput || !fileInput.files || !fileInput.files[0]){
    showBanner('Veuillez sélectionner un fichier.', 'error'); return;
  }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      let rows = [];
      if(file.name.toLowerCase().endsWith('.csv')){
        // Parse CSV manually
        const text = e.target.result;
        const lines = text.split(/\r?\n/).filter(l=>l.trim());
        const sep = lines[0].includes(';') ? ';' : ',';
        rows = lines.map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
      } else {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      }
      if(rows.length < 2){ showBanner('Fichier vide ou sans données.', 'error'); return; }

      const headers = rows[0];
      const iProjet     = matchCol(headers, 'Projet', 'Project', 'Projet principal');
      const iSous       = matchCol(headers, 'Sous-projet', 'Sous projet', 'Subproject');
      const iDesc       = matchCol(headers, 'Description', 'Tâche', 'Tache', 'Task', 'Titre');
      const iResp       = matchCol(headers, 'Responsable', 'Responsible', 'Assigné', 'Assigne');
      const iDate       = matchCol(headers, 'Échéance', 'Echeance', 'Due date', 'Deadline', 'Date');
      const iStatut     = matchCol(headers, 'Statut', 'Status', 'État', 'Etat');
      const iOrigine    = matchCol(headers, 'Origine', 'Source', 'Notes', 'Note');

      if(iDesc < 0){ showBanner('Colonne "Description" ou "Tâche" introuvable.', 'error'); return; }

      // Group by project (and sub-project)
      const byKey = {}; // key = "project|||subproject"
      rows.slice(1).forEach(row => {
        const desc = String(row[iDesc]||'').trim();
        if(!desc) return;
        const projet = iProjet>=0 ? String(row[iProjet]||'').trim() : 'Import Excel';
        const sous   = iSous>=0   ? String(row[iSous]||'').trim()   : '';
        const resp   = iResp>=0   ? String(row[iResp]||'').trim()   : '';
        let echeance = iDate>=0   ? String(row[iDate]||'').trim()   : '';
        const rawStatut = iStatut>=0 ? String(row[iStatut]||'').trim().toLowerCase() : '';
        const origine = iOrigine>=0 ? String(row[iOrigine]||'').trim() : '';

        // Normalize status
        let statut = 'à faire';
        if(['fait','done','terminé','termine','completed','yes','oui'].some(s=>rawStatut.includes(s))) statut = 'fait';
        else if(['cours','cours','progress','en cours'].some(s=>rawStatut.includes(s))) statut = 'en cours';

        // Normalize date
        if(echeance && /^\d{5}$/.test(echeance)){
          // Excel serial date
          const d = XLSX.SSF.parse_date_code(Number(echeance));
          if(d) echeance = d.y + '-' + String(d.m).padStart(2,'0') + '-' + String(d.d).padStart(2,'0');
        }

        const key = projet + '|||' + sous;
        if(!byKey[key]) byKey[key] = { projet, sous, tasks:[] };
        byKey[key].tasks.push({ id:uid(), description:desc, responsable:resp, echeance, statut, _note:origine });
      });

      const totalTasks = Object.values(byKey).reduce((a,v)=>a+v.tasks.length,0);
      if(totalTasks===0){ showBanner('Aucune tâche valide trouvée.', 'error'); return; }

      const importDate = todayStr();
      const importLabel = 'Import Excel — ' + fmtDate(importDate);

      Object.entries(byKey).forEach(([key, group])=>{
        const { projet, sous, tasks } = group;
        // Find or create project
        let projObj = state.data.projects.find(p => p.name.toLowerCase()===projet.toLowerCase() && !p.parentId);
        if(!projObj){
          const pid = uid();
          projObj = { id:pid, name:projet, description:'', status:'Actif', color:PROJECT_COLORS[state.data.projects.length % PROJECT_COLORS.length], parentId:null, createdAt:importDate };
          state.data.projects.push(projObj);
          state.data.seances[pid] = [];
          state.data.pages[pid] = [];
        }
        let targetId = projObj.id;
        // If sub-project specified, find or create it
        if(sous){
          let subObj = state.data.projects.find(p => p.name.toLowerCase()===sous.toLowerCase() && p.parentId===projObj.id);
          if(!subObj){
            const sid = uid();
            subObj = { id:sid, name:sous, description:'', status:'Actif', color:projObj.color, parentId:projObj.id, createdAt:importDate };
            state.data.projects.push(subObj);
            state.data.seances[sid] = [];
            state.data.pages[sid] = [];
          }
          targetId = subObj.id;
        }
        // Add page with tasks
        if(!state.data.pages[targetId]) state.data.pages[targetId] = [];
        state.data.pages[targetId].push({
          id: uid(),
          title: importLabel + (sous ? ' (' + sous + ')' : ''),
          notes: 'Tâches importées depuis Excel/CSV le ' + fmtDate(importDate) + '.',
          source: 'manuel',
          createdAt: importDate,
          taches: tasks.map(t=>({ id:t.id, description:t.description, responsable:t.responsable, echeance:t.echeance, statut:t.statut }))
        });
      });

      state.modal = null;
      state.view = 'dashboard';
      persistAndRender();
      showBanner(totalTasks + ' tâche(s) importée(s) depuis Excel.', 'success');
    } catch(err){
      showBanner('Erreur lors de la lecture du fichier : ' + err.message, 'error');
    }
  };
  if(file.name.toLowerCase().endsWith('.csv')) reader.readAsText(file, 'UTF-8');
  else reader.readAsArrayBuffer(file);
}

function epvCollectEntry(pid){
  const date = document.getElementById('epv-date').value || todayStr();
  const participants = document.getElementById('epv-participants').value.split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
  // Read notes from RTE contenteditable
  const notesEl = document.getElementById('epv-notes');
  const notes = notesEl ? (notesEl.innerHTML||notesEl.value||'').replace(/&nbsp;/g,' ').trim() : '';
  // Read conclusions from RTE contenteditable divs
  const conclusions = [];
  let ci = 0;
  while(document.getElementById('epv-conclusion-'+ci)){
    const el = document.getElementById('epv-conclusion-'+ci);
    const val = (el.innerHTML||el.value||'').replace(/&nbsp;/g,' ').trim();
    if(val) conclusions.push(val);
    ci++;
  }
  const taskDescs = document.querySelectorAll('.epv-task-desc');
  const taskResps = document.querySelectorAll('.epv-task-resp');
  const taskDates = document.querySelectorAll('.epv-task-date');
  const taskStatuts = document.querySelectorAll('.epv-task-statut');
  const taskPrios = document.querySelectorAll('.epv-task-priority');
  const taskPrioWhens = document.querySelectorAll('.epv-prio-when');
  const taskPrioDates = document.querySelectorAll('.epv-prio-date');
  const taches = [...taskDescs].map((el,i)=>{
    const isPrio = taskPrios[i] && taskPrios[i].checked;
    const prioWhenEls = taskPrioWhens[i] ? el.closest('.epv-task-row').querySelectorAll('.epv-prio-when') : [];
    const prioWhen = [...prioWhenEls].find(r=>r.checked);
    const prioDate = taskPrioDates[i] ? taskPrioDates[i].value : '';
    return {
      id: uid(), description: el.value.trim(),
      responsable: taskResps[i] ? taskResps[i].value.trim() : '',
      echeance: taskDates[i] ? taskDates[i].value : '',
      statut: taskStatuts[i] ? taskStatuts[i].value : 'à faire',
      priority: isPrio || false,
      priorityFrom: (isPrio && prioWhen && prioWhen.value==='later' && prioDate) ? prioDate : null
    };
  }).filter(t=>t.description);
  return { date, participants, notes, conclusions, taches };
}

function epvExport(pid){
  const entries = getEPV(pid);
  if(!entries.length) return;
  const p = getProject(pid);
  const o = '\x3c', c = '\x3e';
  let body = '';
  entries.forEach((e,i) => {
    body += o+'h2'+c+'Entrée '+(i+1)+' — '+fmtDate(e.date)+o+'/h2'+c;
    if(e.participants&&e.participants.length) body += o+'p'+c+'Participants : '+escapeHtml(e.participants.join(', '))+o+'/p'+c;
    if(e.notes) body += o+'h3'+c+'Notes'+o+'/h3'+c+o+'p style="white-space:pre-wrap;"'+c+escapeHtml(e.notes)+o+'/p'+c;
    if(e.conclusions&&e.conclusions.filter(c2=>c2&&c2.trim()).length){
      body += o+'h3'+c+'Conclusions'+o+'/h3'+c+o+'ol'+c+e.conclusions.filter(c2=>c2&&c2.trim()).map(cc=>o+'li'+c+escapeHtml(stripHtml(cc))+o+'/li'+c).join('')+o+'/ol'+c;
    }
    if(e.taches&&e.taches.length){
      body += o+'h3'+c+'Tâches'+o+'/h3'+c+o+'table border="1" cellpadding="5" style="border-collapse:collapse;width:100%"'+c+
        o+'tr'+c+o+'th'+c+'Tâche'+o+'/th'+c+o+'th'+c+'Responsable'+o+'/th'+c+o+'th'+c+'Échéance'+o+'/th'+c+o+'th'+c+'Statut'+o+'/th'+c+o+'/tr'+c+
        e.taches.map(t=>o+'tr'+c+o+'td'+c+escapeHtml(t.description||'')+o+'/td'+c+o+'td'+c+(t.responsable||'—')+o+'/td'+c+o+'td'+c+(fmtDate(t.echeance)||'—')+o+'/td'+c+o+'td'+c+escapeHtml(t.statut)+o+'/td'+c+o+'/tr'+c).join('')+
        o+'/table'+c;
    }
    body += o+'hr'+c;
  });
  const doc = o+'html xmlns:w="urn:schemas-microsoft-com:office:word"'+c+
    o+'head'+c+o+'meta charset="UTF-8"'+c+o+'style'+c+'body{font-family:Arial;font-size:11pt;} h2{color:#1A4A7A;} h3{color:#557A98;font-size:10pt;}'+o+'/style'+c+o+'/head'+c+
    o+'body'+c+o+'h1 style="color:#1A4A7A;"'+c+'Suivi continu — '+escapeHtml(p?p.name:pid)+o+'/h1'+c+body+o+'/body'+c+o+'/html'+c;
  const blob = new Blob(['\uFEFF'+doc], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='suivi-continu-'+(p?p.name.replace(/\s+/g,'-'):'projet')+'.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

const PV_STATUT_MAP = { 'a_traiter':'à faire','en_cours':'en cours','realise':'fait (R.A.)','termine':'fait','non_realise':'non réalisé' };

function pvFindProject(nomProjet){
  // Try to match project name (case-insensitive, partial)
  if(!nomProjet) return null;
  const norm = s => s.toLowerCase().replace(/[@\-\s]/g,'');
  const projects = state.data.projects;
  return projects.find(p=>norm(p.name)===norm(nomProjet))
    || projects.find(p=>norm(p.name).includes(norm(nomProjet)) || norm(nomProjet).includes(norm(p.name)))
    || null;
}

document.getElementById('app').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  // Don't fire click during a drag operation
  if(state.dragProjectId && el.classList.contains('project-tab')) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  const pid = el.getAttribute('data-pid');
  const idx = el.getAttribute('data-idx');

  switch(action){
    case 'open-dashboard': openDashboard(); break;
    case 'open-home': openHome(); break;
    case 'open-calendar': openCalendar(); break;
    case 'open-project': openProject(id); break;

    case 'cal-prev-year': state.calYear--; render(); break;
    case 'cal-next-year': state.calYear++; render(); break;

    case 'add-cal-row':
      state.modal = { type:'cal-row', row:{} }; render(); break;
    case 'edit-cal-row': {
      const rowToEdit = state.data.calendar.rows.find(r=>r.id===id);
      if(rowToEdit) { state.modal = { type:'cal-row', row:{...rowToEdit} }; render(); }
      break;
    }
    case 'save-cal-row': {
      const label = document.getElementById('cr-label').value.trim();
      if(!label) break;
      const sub = document.getElementById('cr-sub').value.trim();
      const cat = document.getElementById('cr-cat').value.trim();
      const existing = state.modal.row && state.modal.row.id;
      let rowId5;
      if(existing){
        const r = state.data.calendar.rows.find(x=>x.id===existing);
        if(r){ r.label=label; r.sub=sub; r.category=cat; }
        rowId5 = existing;
      } else {
        rowId5 = uid();
        state.data.calendar.rows.push({ id:rowId5, label, sub, category:cat });
        // Also create event if checked
        const addEv = document.getElementById('cr-add-event');
        if(addEv && addEv.checked){
          const evText = (document.getElementById('cr-ev-text').value||'').trim();
          const evStart = Number(document.getElementById('cr-ev-start').value);
          const evEnd = Math.max(evStart, Number(document.getElementById('cr-ev-end').value));
          const evColor = document.getElementById('cr-ev-color').value || 'ec-rose';
          const evRecurring = document.getElementById('cr-ev-recurring').checked;
          const evRemOn = document.getElementById('cr-ev-reminder').checked;
          const evReminder = evRemOn ? {
            active:true,
            amount: Number(document.getElementById('cr-rem-amount').value)||1,
            unit: document.getElementById('cr-rem-unit').value||'mois',
            recurring: document.getElementById('cr-rem-recurring').checked
          } : { active:false };
          if(evText) state.data.calendar.events.push({ id:uid(), rowId:rowId5, year:state.calYear, startMonth:evStart, endMonth:evEnd, colorClass:evColor, text:evText, recurring:evRecurring, reminder:evReminder });
        }
      }
      state.modal=null; persistAndRender(); break;
    }

    }
    case 'confirm-priority-now': {
      const m = state.modal; if(!m) break;
      const t = findTaskById(m.taskId, m.projectId);
      if(t){ t.priority = true; t.priorityFrom = null; }
      state.modal = null; persistAndRender(); break;
    }
    case 'confirm-priority-later': {
      const m = state.modal; if(!m) break;
      const dateVal = document.getElementById('prio-date')?.value;
      if(!dateVal){ showBanner('Veuillez choisir une date.'); break; }
      const t = findTaskById(m.taskId, m.projectId);
      if(t){ t.priority = true; t.priorityFrom = dateVal; }
      state.modal = null; persistAndRender();
      showBanner('Tâche planifiée en prioritaire à partir du '+fmtDate(dateVal)+'.','success');
      break;
    }
    case 'delete-task': {
      const dtTaskId  = el.getAttribute('data-task-id');
      const dtProjId  = el.getAttribute('data-project-id');
      const dtOrigin  = el.getAttribute('data-origin');
      const dtSeance  = el.getAttribute('data-seance-id');
      const dtPage    = el.getAttribute('data-page-id');
      function removeTask(arr){ const i=arr.findIndex(x=>x.id===dtTaskId); if(i>=0) arr.splice(i,1); }
      state.modal = { type:'confirm-delete', message:'Supprimer définitivement cette tâche ?',
        pendingAction:()=>{
          if(dtOrigin==='page' && dtPage){
            const pg=getPages(dtProjId).find(x=>x.id===dtPage); if(pg) removeTask(pg.taches||[]);
          } else if(dtOrigin==='seance' && dtSeance){
            const s=getSeances(dtProjId).find(x=>x.id===dtSeance); if(s) removeTask(s.taches||[]);
          } else {
            const proj3=getProject(dtProjId);
            if(proj3&&(proj3.directTasks||[]).find(x=>x.id===dtTaskId)) removeTask(proj3.directTasks);
            else {
              let found = false;
              for(const s of getSeances(dtProjId)){ if(s.taches&&s.taches.find(x=>x.id===dtTaskId)){removeTask(s.taches);found=true;break;} }
              if(!found) for(const pg of getPages(dtProjId)){ if(pg.taches&&pg.taches.find(x=>x.id===dtTaskId)){removeTask(pg.taches);break;} }
              if(!found) getEPV(dtProjId).forEach(entry=>{ if(entry.taches&&entry.taches.find(x=>x.id===dtTaskId)) removeTask(entry.taches); });
            }
          }
          state.modal=null; persistAndRender();
        }
      }; render(); break;
    }
    case 'open-edit-task': {
      const projectId = el.getAttribute('data-project-id');
      const taskId    = el.getAttribute('data-task-id');
      const origin    = el.getAttribute('data-origin');
      const seanceId  = el.getAttribute('data-seance-id');
      const pageId    = el.getAttribute('data-page-id');
      let foundTask = null;
      if(origin === 'page' && pageId){
        const pg = getPages(projectId).find(x=>x.id===pageId);
        if(pg) foundTask = (pg.taches||[]).find(x=>x.id===taskId);
      } else if(origin === 'seance' && seanceId){
        const s = getSeances(projectId).find(x=>x.id===seanceId);
        if(s) foundTask = (s.taches||[]).find(x=>x.id===taskId);
      }
      if(!foundTask){
        for(const s of getSeances(projectId)){
          foundTask = (s.taches||[]).find(x=>x.id===taskId);
          if(foundTask) break;
        }
      }
      if(!foundTask){
        for(const pg of getPages(projectId)){
          foundTask = (pg.taches||[]).find(x=>x.id===taskId);
          if(foundTask) break;
        }
      }
      if(!foundTask){
        const proj = getProject(projectId);
        foundTask = (proj && proj.directTasks||[]).find(x=>x.id===taskId) || null;
      }
      if(!foundTask){
        getEPV(projectId).forEach(entry => {
          if(!foundTask) foundTask = (entry.taches||[]).find(x=>x.id===taskId) || null;
        });
      }
      if(foundTask){
        state.modal = { type:'edit-task', task:foundTask, projectId, origin, seanceId, pageId };
        render();
      }
      break;
    }
    case 'save-edit-task': {
      const m = state.modal;
      if(!m || !m.task) break;
      m.task.description = document.getElementById('et-desc').value.trim();
      m.task.responsable  = document.getElementById('et-resp').value.trim();
      const noDate = document.getElementById('et-no-date') && document.getElementById('et-no-date').checked;
      m.task.echeance = noDate ? '' : document.getElementById('et-date').value;
      setTaskStatut(m.task, document.getElementById('et-statut').value);

      // Handle move to another project
      const moveToggle = document.getElementById('et-move-toggle');
      const moveTarget = document.getElementById('et-move-target');
      if(moveToggle && moveToggle.checked && moveTarget && moveTarget.value){
        const targetProjId = moveTarget.value;
        const targetProj = getProject(targetProjId);
        if(targetProj && targetProjId !== m.projectId){
          // Remove from current location
          const taskCopy = { ...m.task, id: m.task.id };
          if(m.origin==='page' && m.pageId){
            const pg = getPages(m.projectId).find(x=>x.id===m.pageId);
            if(pg) pg.taches = (pg.taches||[]).filter(x=>x.id!==taskCopy.id);
          } else if(m.origin==='seance' && m.seanceId){
            const s = getSeances(m.projectId).find(x=>x.id===m.seanceId);
            if(s) s.taches = (s.taches||[]).filter(x=>x.id!==taskCopy.id);
          } else {
            const srcProj = getProject(m.projectId);
            if(srcProj && srcProj.directTasks) srcProj.directTasks = srcProj.directTasks.filter(x=>x.id!==taskCopy.id);
            else {
              for(const s of getSeances(m.projectId)){ if((s.taches||[]).find(x=>x.id===taskCopy.id)){ s.taches=s.taches.filter(x=>x.id!==taskCopy.id); break; } }
              for(const pg of getPages(m.projectId)){ if((pg.taches||[]).find(x=>x.id===taskCopy.id)){ pg.taches=pg.taches.filter(x=>x.id!==taskCopy.id); break; } }
            }
          }
          // Add to target project's directTasks
          if(!targetProj.directTasks) targetProj.directTasks = [];
          targetProj.directTasks.push({ ...taskCopy });
          showBanner('Tâche déplacée vers « ' + targetProj.name + ' »', 'success');
        }
      }

      state.modal = null;
      persistAndRender();
      break;
    }

    case 'open-new-project': openNewProjectModal(null); break;
    case 'open-new-subproject': openNewProjectModal(id); break;
    case 'open-edit-project': openEditProjectModal(id); break;
    case 'clear-prev-date': {
      const prev = el.previousElementSibling;
      if(prev && prev.type==='date') prev.value='';
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'save-project': saveProjectModal(id || null); break;
    case 'delete-project': deleteProject(id); break;

    case 'add-vigilance':
      state.modal = { type:'vigilance', projectId:id, idx:null }; render(); break;
    case 'edit-vigilance':
      state.modal = { type:'vigilance', projectId:el.getAttribute('data-id'), idx:Number(idx) }; render(); break;
    case 'delete-vigilance': {
      const vigProjId = el.getAttribute('data-id');
      const vigIdx = Number(idx);
      state.modal = { type:'confirm-delete', message:'Supprimer ce point de vigilance ?',
        pendingAction: () => {
          const p = getProject(vigProjId);
          if(p && p.vigilances) p.vigilances.splice(vigIdx, 1);
          state.modal = null;
          persistAndRender();
        }
      };
      render(); break;
    }
    case 'confirm-delete-ok': {
      if(state.modal && state.modal.pendingAction){
        state.modal.pendingAction();
      } else {
        state.modal = null; render();
      }
      break;
    }
    case 'save-vigilance': {
      const vigEl = document.getElementById('vig-text');
      const text = vigEl ? (vigEl.innerHTML||vigEl.value||'').replace(/&nbsp;/g,' ').trim() : '';
      if(!text) return;
      const pid = el.getAttribute('data-id');
      const vidx = el.getAttribute('data-idx');
      const p = getProject(pid);
      if(!p.vigilances) p.vigilances = [];
      if(vidx !== '' && vidx !== null && vidx !== undefined){
        p.vigilances[Number(vidx)] = { text };
      } else {
        p.vigilances.push({ text });
      }
      state.modal = null;
      persistAndRender();
      break;
    }

    case 'add-development':
      state.modal = { type:'development', projectId:id, idx:null }; render(); break;
    case 'edit-development':
      state.modal = { type:'development', projectId:el.getAttribute('data-id'), idx:Number(idx) }; render(); break;
    case 'delete-development': {
      const devProjId = el.getAttribute('data-id');
      const devIdx = Number(idx);
      state.modal = { type:'confirm-delete', message:'Supprimer cette perspective de d\u00e9veloppement ?',
        pendingAction: () => {
          const proj = getProject(devProjId);
          if(proj && proj.developments) proj.developments.splice(devIdx, 1);
          state.modal = null; persistAndRender();
        }
      };
      render(); break;
    }
    case 'save-development': {
      const devEl = document.getElementById('dev-text');
      const devText = devEl ? (devEl.innerHTML||devEl.value||'').replace(/&nbsp;/g,' ').trim() : '';
      if(!devText) break;
      const devPid = el.getAttribute('data-id');
      const devVidx = el.getAttribute('data-idx');
      const devProj = getProject(devPid);
      if(!devProj.developments) devProj.developments = [];
      if(devVidx !== '' && devVidx !== null && devVidx !== undefined){
        devProj.developments[Number(devVidx)] = { text: devText };
      } else {
        devProj.developments.push({ text: devText });
      }
      state.modal = null; persistAndRender(); break;
    }

    case 'export-json': exportJson(); break;
    case 'export-excel': exportExcel(); break;
    case 'export-ra-excel': exportRaExcel(); break;
    case 'export-ra-word': exportRaWord(); break;
    case 'open-import-excel-modal': state.modal = { type:'import-excel' }; render(); break;
    case 'save-import-excel': importFromExcel(); break;
    case 'export-json-from-reminder': exportJson(); state.banner=null; render(); break;
    case 'dismiss-reminder': state.banner=null; stampExportTime(); render(); break;
    case 'reset-data': resetData(); break;

    case 'sort-col': {
      const col = el.getAttribute('data-col');
      if(state.dashSort.col === col){ state.dashSort.dir *= -1; }
      else { state.dashSort.col = col; state.dashSort.dir = 1; }
      render(); break;
    }
    case 'proj-sort-col': {
      const col = el.getAttribute('data-col');
      if(state.projSort.col === col){ state.projSort.dir *= -1; }
      else { state.projSort.col = col; state.projSort.dir = 1; }
      render(); break;
    }
    case 'print-pv': {
      const calHtml = document.querySelector('.cal-wrap');
      if(calHtml){
        const o = '\x3c', c = '\x3e';
        const w = window.open('','_blank','width=1200,height=800');
        if(w){
          w.document.write(o+'html'+c+o+'head'+c+o+'title'+c+'Calendrier '+state.calYear+o+'/title'+c+
            o+'style'+c+
            'body{font-family:Arial,sans-serif;font-size:11px;}' +
            'table{border-collapse:collapse;width:100%;}' +
            'th,td{border:1px solid #ccc;padding:3px 5px;vertical-align:top;}' +
            'th{background:#eef;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}' +
            '.ec-rose{background:#F2C4CA;}.ec-mauve{background:#D4B8E0;}.ec-sage{background:#B8D4C0;}' +
            '.ec-blush{background:#F0D4C4;}.ec-teal{background:#B4D8D4;}.ec-lavender{background:#C8C0E0;}' +
            '.ec-peach{background:#F4C8B0;}.ec-mint{background:#B8E0D0;}' +
            '.cal-event{padding:2px 5px;border-radius:3px;font-size:10px;margin:1px 0;}' +
            '.prep-block{opacity:.5;font-style:italic;}' +
            o+'/style'+c+
            o+'/head'+c+o+'body'+c+
            o+'h2 style="margin:0 0 12px;font-family:Georgia,serif;"'+c+'Calendrier '+state.calYear+o+'/h2'+c+
            calHtml.innerHTML+
            o+'/body'+c+o+'/html'+c);
          w.document.close();
          w.print();
        }
      } else { window.print(); }
      break;
    }

    case 'filter-overdue':
      state.dashboardFilters.onlyOverdue = !state.dashboardFilters.onlyOverdue; render(); break;

    case 'dash-filter-reset':
      state.dashboardFilters.statut = 'all'; state.dashboardFilters.onlyOverdue = false; render(); break;
    case 'dash-filter-statut': {
      const value = el.getAttribute('data-value');
      state.dashboardFilters.onlyOverdue = false;
      state.dashboardFilters.statut = (state.dashboardFilters.statut === value) ? 'all' : value;
      render(); break;
    }
    case 'dash-filter-overdue':
      state.dashboardFilters.statut = 'all';
      state.dashboardFilters.onlyOverdue = !state.dashboardFilters.onlyOverdue;
      render(); break;
  }
});

document.getElementById('app').addEventListener('change', function(e){
  const t = e.target;
  if(t.matches('[data-action="filter-projet"]')){ state.dashboardFilters.projet = t.value; render(); return; }
  if(t.matches('[data-action="filter-statut"]')){ state.dashboardFilters.statut = t.value; render(); return; }
  if(t.matches('[data-action="filter-origine"]')){ state.dashboardFilters.origine = t.value; render(); return; }
  if(t.matches('[data-action="filter-responsable"]')){ state.dashboardFilters.responsable = t.value; render(); return; }
  if(t.matches('[data-action="ra-filter-year"]')){ state.raYear = t.value; render(); return; }
  if(t.matches('[data-action="toggle-quick-note"]')){
    const note = (state.data.quickNotes||[]).find(n=>n.id===t.getAttribute('data-id'));
    if(note){ note.done = t.checked; persistAndRender(); }
    return;
  }

  if(t.matches('[data-field="task-statut"]') || t.matches('[data-field="task-date"]')){
    const arr = currentDraftTasks();
    if(!arr) return;
    const i = Number(t.getAttribute('data-idx'));
    if(t.matches('[data-field="task-statut"]')) arr[i].statut = t.value;
    if(t.matches('[data-field="task-date"]')) arr[i].echeance = t.value;
  }

  if(t.matches('[data-field="dash-task-statut"]')){
    const projectId = t.getAttribute('data-project-id');
    const origin = t.getAttribute('data-origin');
    const taskId = t.getAttribute('data-task-id');
    const newStatut = t.value;
    if(origin==='seance'){
      const s = getSeances(projectId).find(x=>x.id===t.getAttribute('data-seance-id'));
      if(s){ const task=(s.taches||[]).find(x=>x.id===taskId); if(task) setTaskStatut(task, newStatut); }
    } else {
      const pg = getPages(projectId).find(x=>x.id===t.getAttribute('data-page-id'));
      if(pg){ const task=(pg.taches||[]).find(x=>x.id===taskId); if(task) setTaskStatut(task, newStatut); }
    }
    persistAndRender();
  }

  if(t.matches('[data-field="proj-task-statut"]')){
    const projectId = t.getAttribute('data-project-id');
    const taskId    = t.getAttribute('data-task-id');
    const isPage    = t.getAttribute('data-is-page') === '1';
    const pageId    = t.getAttribute('data-page-id');
    const newStatut = t.value;
    if(isPage){
      const pg = getPages(projectId).find(x=>x.id===pageId);
      if(pg){ const task=(pg.taches||[]).find(x=>x.id===taskId); if(task) setTaskStatut(task, newStatut); }
    } else {
      for(const s of getSeances(projectId)){
        const task = (s.taches||[]).find(x=>x.id===taskId);
        if(task){ setTaskStatut(task, newStatut); break; }
      }
    }
    persistAndRender();
  }
});

document.getElementById('app').addEventListener('input', function(e){
  const t = e.target;
  if(t.matches('[data-field="task-desc"]')){
    const arr = currentDraftTasks(); if(arr) arr[Number(t.getAttribute('data-idx'))].description = t.value;
  } else if(t.matches('[data-field="task-resp"]')){
    const arr = currentDraftTasks(); if(arr) arr[Number(t.getAttribute('data-idx'))].responsable = t.value;
  } else if(t.id === 'f-participants'){
    state.draftParticipants = t.value;
  } else if(t.id === 'f-date' && state.draftSeance){
    state.draftSeance.date = t.value;
  } else if(t.id === 'f-notes' && state.draftSeance){
    state.draftSeance.notes = t.value;
  } else if(t.id === 'pg-title' && state.draftPage){
    state.draftPage.title = t.value;
  } else if(t.id === 'pg-notes' && state.draftPage){
    state.draftPage.notes = t.value;
  } else if(t.id === 'qn-input'){
    state.homeNoteInput = t.value;
  }
});

document.getElementById('app').addEventListener('keydown', function(e){
  // Shift+Enter in RTE body: exit list or insert soft line break
  if(e.key === 'Enter' && e.shiftKey && e.target.classList.contains('rte-body')){
    e.preventDefault();
    const sel = window.getSelection();
    if(sel && sel.rangeCount){
      const node = sel.anchorNode;
      const el2 = node && (node.nodeType===3 ? node.parentElement : node);
      const inUl = el2 && el2.closest('ul');
      const inOl = el2 && el2.closest('ol');
      if(inUl){ document.execCommand('insertUnorderedList'); }
      else if(inOl){ document.execCommand('insertOrderedList'); }
      else { document.execCommand('insertHTML', false, '<br>'); }
    }
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'direct-task-desc'){
    const addBtn = document.querySelector('[data-action="add-direct-task"]'); if(addBtn) addBtn.click();
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'qn-input'){
    const text = e.target.value.trim();
    if(text){
      if(!state.data.quickNotes) state.data.quickNotes = [];
      state.data.quickNotes.push({ id:uid(), text, done:false, createdAt:todayStr() });
      state.homeNoteInput = '';
      persistAndRender();
    }
  }
});

/* ============== INIT ============== */
async function init(){
  try {
    render();
    await loadData();
    state.view = 'home';
    render();
    await checkWeeklyReminder();
    if(!state.banner && state.data.projects.length === 0){
      showBanner('Aucun projet trouvé dans cet outil. Si vous attendiez de retrouver des projets existants, utilisez « Importer (JSON) » pour les restaurer depuis une sauvegarde.', 'info');
    }
  } catch(err) {
    const root = document.getElementById('app');
    if(root) root.innerHTML = '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;">' +
      '<div style="padding:32px;font-family:monospace;color:#A6383A;max-width:600px;">' +
      '<strong>Erreur d\'initialisation :</strong><br>' + (err && err.message ? err.message : String(err)) +
      (err && err.stack ? '<pre style="margin-top:12px;font-size:.72rem;overflow:auto;white-space:pre-wrap;">' + err.stack + '</pre>' : '') +
      '</div></div>';
  }
}
init();
</script>
