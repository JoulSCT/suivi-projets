<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de Projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html{font-size:18.5px !important;}
  :root{
    --paper:#F0F3F8;
    --paper-line:#D0D9E8;
    --card:#FFFFFF;
    --ink:#0F1E2E;
    --ink-soft:#5A6E85;
    --navy:#1A4A7A;
    --navy-soft:#2560A0;
    --stamp-red:#D43C3C;
    --seal-gold:#C07820;
    --sage:#1A7A5A;
    --blush:#EBF1FA;
    --lavender:#E8F0FB;
    --sidebar-bg:#0D1E30;
    --sidebar-hover:rgba(255,255,255,.07);
    --sidebar-active:rgba(255,255,255,.14);
    --shadow-sm:0 1px 3px rgba(15,30,46,.08),0 1px 6px rgba(15,30,46,.04);
    --shadow-md:0 4px 12px rgba(15,30,46,.1),0 2px 4px rgba(15,30,46,.06);
    --shadow-lg:0 8px 24px rgba(15,30,46,.12);
    --radius:10px;
    --font-display:'Source Serif 4', serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
    --paper-line:#D8E0EA;
    --card:#FFFFFF;
    --ink:#1E2A38;
    --ink-soft:#6A7A8E;
    --navy:#3D6480;
    --navy-soft:#557A98;
    --stamp-red:#B84040;
    --seal-gold:#A87A3A;
    --sage:#3E7060;
    --blush:#E8EEF5;
    --lavender:#EAF0F8;
    --font-display:'Source Serif 4', serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:1rem;line-height:1.55;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  ::selection{background:rgba(26,74,122,.18);}
  #app{display:flex;min-height:100vh;}

  /* ===== SIDEBAR ===== */
  .sidebar{width:240px;flex-shrink:0;background:var(--sidebar-bg);color:#C8D4E0;display:flex;flex-direction:column;}
  .sidebar-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-mark{font-family:var(--font-display);font-size:1.1rem;font-weight:600;margin:0;color:#fff;letter-spacing:.01em;}
  .brand-sub{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#6A8098;margin-top:3px;}
  .nav-dashboard{margin:10px 10px 4px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;color:#A8BACA;text-decoration:none;background:none;border:none;width:100%;text-align:left;font-size:.84rem;font-weight:400;transition:background .12s;}
  .nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.7;}
  .nav-item:hover{background:var(--sidebar-hover);color:#DCE6F0;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:500;}
  .nav-item.active svg{opacity:1;}
  .project-list-label{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#4A6078;padding:10px 18px 3px;margin-top:6px;}
  .project-list{flex:1;overflow-y:auto;padding:0 8px 8px;}
  .sub-project-group{margin-bottom:2px;}
  .project-tab{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px;color:#C0D0E0;background:none;border:none;width:100%;text-align:left;font-size:.84rem;transition:background .12s,color .12s;}
  .project-tab:hover{background:var(--sidebar-hover);color:#E2EEF8;}
  .project-tab.active{background:var(--sidebar-active);color:#fff;font-weight:500;}
  .project-tab.sub{margin-left:12px;width:calc(100% - 12px);font-size:.8rem;color:#9AAEC0;}
  .project-tab.sub:hover{color:#D0DCE8;}
  .project-tab.sub.active{color:#fff;}
  .project-tab .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .project-tab .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-tab .pcount{font-family:var(--font-mono);font-size:.65rem;color:#7A95AA;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:8px;flex-shrink:0;}
  .project-tab.active .pcount{color:#C0D8F0;background:rgba(255,255,255,.18);}
  .project-tab .vig-dot{font-family:var(--font-mono);font-size:.62rem;font-weight:700;background:#C07820;color:#fff;border-radius:4px;padding:1px 5px;flex-shrink:0;}
  .project-tab[draggable]{cursor:grab;}
  .project-tab[draggable]:active{cursor:grabbing;}
  .project-tab.drag-source{opacity:.4;}
  .project-tab.drag-over-top{box-shadow:0 -2px 0 rgba(255,255,255,.5);}
  .project-tab.drag-over-bottom{box-shadow:0 2px 0 rgba(255,255,255,.5);}
  .sidebar-footer{padding:10px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:2px;}
  .footer-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:none;border:none;color:#7A94A8;font-size:.78rem;width:100%;text-align:left;transition:background .1s;}
  .footer-btn svg{width:13px;height:13px;}
  .footer-btn:hover{background:var(--sidebar-hover);color:#C0D0DC;}

  /* ===== MAIN CONTENT ===== */
  main.content{flex:1;padding:32px 40px 56px;overflow-y:auto;}
  .view-enter{animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .page-title{font-family:var(--font-display);font-size:1.6rem;font-weight:600;margin:0 0 2px;color:var(--ink);}
  .page-sub{color:var(--ink-soft);font-size:.84rem;margin:0 0 24px;}
  .eyebrow{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}

  /* ===== BUTTONS ===== */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--paper-line);background:var(--card);color:var(--ink);font-size:.82rem;font-weight:500;box-shadow:var(--shadow-sm);transition:all .12s;}
  .btn svg{width:13px;height:13px;}
  .btn:hover{border-color:var(--navy);box-shadow:var(--shadow-md);}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 6px rgba(26,74,122,.3);}
  .btn-primary:hover{background:var(--navy-soft);box-shadow:0 4px 10px rgba(26,74,122,.35);}
  .btn-danger{color:var(--stamp-red);}
  .btn-danger:hover{border-color:var(--stamp-red);}
  .btn-ghost{border-color:transparent;background:none;box-shadow:none;}
  .btn-ghost:hover{border-color:var(--paper-line);background:var(--card);}
  .btn-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .icon-btn{padding:6px;border-radius:5px;border:1px solid transparent;background:none;color:var(--ink-soft);display:inline-flex;transition:all .1s;}
  .icon-btn svg{width:14px;height:14px;}
  .icon-btn:hover{background:var(--blush);color:var(--ink);}
  .breadcrumb-link{background:none;border:none;padding:0;color:var(--navy);font-weight:500;cursor:pointer;text-decoration:underline;font-size:inherit;font-family:inherit;}

  /* ===== KPI STAT CARDS ===== */
  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  .stat-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);transition:all .14s;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy);opacity:.15;transition:opacity .14s;}
  .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .stat-card:hover::before{opacity:.5;}
  .stat-card.active{border-color:var(--navy);box-shadow:0 0 0 2px rgba(26,74,122,.15);background:#F5F8FD;}
  .stat-card.active::before{opacity:1;}
  .stat-num{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1;color:var(--navy);}
  .stat-label{font-size:.68rem;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);}
  .stat-card.overdue .stat-num{color:var(--stamp-red);}
  .stat-card.overdue::before{background:var(--stamp-red);}
  .stat-card.overdue.active{box-shadow:0 0 0 2px rgba(212,60,60,.15);border-color:var(--stamp-red);}

  /* ===== STATUS BAR ===== */
  .status-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:8px;background:var(--paper-line);}
  .status-bar-segment{height:100%;}
  .status-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft);margin-bottom:20px;}
  .status-legend-item{display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 8px;border-radius:5px;transition:background .1s;}
  .status-legend-item:hover{background:var(--blush);color:var(--ink);}
  .status-legend-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  /* ===== STATUS BADGES ===== */
  .status-select{padding:4px 8px;border:none;border-radius:12px;background:var(--blush);font-size:.76rem;font-family:inherit;font-weight:600;cursor:pointer;}
  .overdue-flag{color:var(--stamp-red);font-family:var(--font-mono);font-size:.64rem;letter-spacing:.04em;margin-left:6px;background:#FDEAEA;padding:2px 5px;border-radius:3px;}

  /* ===== FILTERS ===== */
  .filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  select.filter, input.filter{padding:6px 10px;border:1px solid var(--paper-line);border-radius:6px;background:var(--card);font-size:.8rem;font-family:inherit;color:var(--ink);box-shadow:var(--shadow-sm);}
  .filter-check{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-soft);}

  /* ===== LEDGER TABLE ===== */
  table.ledger{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
  table.ledger th{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:10px 14px;border-bottom:2px solid var(--paper-line);background:#F6F9FD;}
  table.ledger th.sortable{cursor:pointer;user-select:none;transition:color .1s;}
  table.ledger th.sortable:hover{color:var(--navy);}
  table.ledger td.task-desc-cell{cursor:pointer;}
  table.ledger td.task-desc-cell:hover{color:var(--navy);text-decoration:underline;text-underline-offset:3px;}
  table.ledger td{padding:10px 14px;border-bottom:1px solid var(--paper-line);font-size:.84rem;vertical-align:top;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger tr:hover td{background:#F8FBFF;}
  table.ledger tr.is-overdue td{background:#FEF5F5;}
  .proj-tag{display:inline-flex;align-items:center;gap:6px;}
  .proj-tag .swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .status-dot{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;}
  .status-dot .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .source-chip{font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--blush);color:var(--ink-soft);margin-left:5px;}

  /* ===== EMPTY STATE ===== */
  .empty-state{background:var(--card);border:1.5px dashed var(--paper-line);border-radius:var(--radius);padding:48px 32px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{font-family:var(--font-display);color:var(--ink);font-size:1.1rem;margin:0 0 6px;}
  .empty-state p{margin:0 0 16px;font-size:.86rem;}
  .empty-state.small{padding:24px 20px;}

  /* ===== PROJECT HEADER ===== */
  .project-header{position:relative;padding:20px 24px;background:var(--card);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .project-header .accent-stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .project-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .project-name{font-family:var(--font-display);font-size:1.3rem;font-weight:600;margin:0 0 4px;}
  .project-ref{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-soft);letter-spacing:.08em;}
  .project-desc{margin:8px 0 0;color:var(--ink-soft);font-size:.84rem;max-width:560px;}
  .project-status-badge{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:12px;border:1px solid var(--paper-line);color:var(--ink-soft);background:var(--blush);white-space:nowrap;}
  .project-actions{display:flex;gap:5px;flex-shrink:0;}

  /* ===== VIGILANCE ===== */
  .vigilance-block{border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
  .vigilance-block.no-points{background:linear-gradient(135deg,#F0FAF5 0%,#E6F5EE 100%);border:1px solid #B8DEC8;}
  .vigilance-block.has-points{background:linear-gradient(135deg,#FFFBF0 0%,#FFF8E6 100%);border:1px solid #E8D870;}
  .dev-block{border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
  .dev-block.no-points{background:linear-gradient(135deg,#EEF4FF 0%,#E8F0FB 100%);border:1px solid #B8CCE8;}
  .dev-block.has-points{background:linear-gradient(135deg,#EBF3FF 0%,#E4EEFA 100%);border:1px solid #90B8E0;}
  .dev-block .dev-title{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#1A3A7A;}
  .vigilance-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .vigilance-title{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
  .vigilance-block.no-points .vigilance-title{color:#1A6040;}
  .vigilance-block.has-points .vigilance-title{color:#7A5800;}
  .vigilance-block.no-points .vigilance-title svg{color:var(--sage);}
  .vigilance-block.has-points .vigilance-title svg{color:var(--seal-gold);}
  .vigilance-empty{color:#1A6040;font-size:.82rem;margin:0;}
  .vigilance-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;}
  .vigilance-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;background:rgba(255,255,255,.7);border-radius:6px;border:1px solid rgba(0,0,0,.06);}
  .vigilance-bullet{width:6px;height:6px;border-radius:50%;background:var(--seal-gold);flex-shrink:0;margin-top:6px;}
  .vigilance-text{flex:1;font-size:.86rem;color:var(--ink);line-height:1.4;}
  .vigilance-text *{color:inherit !important;}
  .vigilance-actions{display:flex;gap:2px;flex-shrink:0;}

  /* ===== SECTION / SUB-PROJECTS ===== */
  .section-block{margin-bottom:24px;}
  .section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .section-heading h2{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0;}
  .subproj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .subproj-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:13px 15px;cursor:pointer;box-shadow:var(--shadow-sm);transition:all .12s;}
  .subproj-card:hover{border-color:var(--navy);box-shadow:var(--shadow-md);}
  .subproj-card .swatch{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .subproj-card-name{font-weight:500;font-size:.88rem;}
  .subproj-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px;}
  .subproj-card-actions{display:flex;gap:2px;flex-shrink:0;}
  .subproj-card-count{margin-top:6px;font-family:var(--font-mono);font-size:.66rem;color:var(--ink-soft);}

  /* ===== TABS ===== */
  .tab-row{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--paper-line);padding-bottom:0;}
  .tab-btn{padding:8px 14px;border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:none;background:none;font-size:.82rem;color:var(--ink-soft);font-weight:500;cursor:pointer;transition:all .12s;margin-bottom:-2px;}
  .tab-btn:hover{background:var(--blush);color:var(--ink);}
  .tab-btn.active{background:var(--card);color:var(--navy);border-color:var(--paper-line);border-bottom:2px solid var(--card);font-weight:600;}

  /* ===== SEANCE CARDS ===== */
  .seance-grid{display:flex;flex-direction:column;gap:8px;}
  .seance-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;position:relative;box-shadow:var(--shadow-sm);transition:all .12s;}
  .seance-card:hover{border-color:var(--navy);box-shadow:var(--shadow-md);}
  .seance-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .seance-title{font-family:var(--font-display);font-weight:600;font-size:.96rem;}
  .seance-date{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);}
  .seance-card-actions{display:flex;gap:2px;flex-shrink:0;}
  .seance-preview{margin:6px 0 0;color:var(--ink-soft);font-size:.8rem;}
  .seance-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .mini-badge{font-family:var(--font-mono);font-size:.64rem;padding:2px 7px;border-radius:10px;background:var(--blush);color:var(--ink-soft);}

  /* ===== PV DOCUMENT ===== */
  .pv-wrap{max-width:760px;}
  .pv-document{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:40px 44px;position:relative;}
  .pv-stamp{position:absolute;top:32px;right:40px;border:2px solid var(--navy);color:var(--navy);padding:6px 12px;border-radius:4px;transform:rotate(-3deg);font-family:var(--font-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;text-align:center;line-height:1.4;}
  .page-source-badge{position:absolute;top:32px;right:40px;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:var(--blush);padding:4px 10px;border-radius:4px;}
  .pv-doctitle{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
  .pv-title{font-family:var(--font-display);font-size:1.45rem;font-weight:600;margin:0 0 12px;max-width:480px;}
  .pv-meta-grid{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;font-size:.84rem;}
  .pv-meta-grid dt{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding-top:2px;}
  .pv-meta-grid dd{margin:0;}
  .pv-divider{border:none;border-top:1px solid var(--paper-line);margin:20px 0;}
  .pv-section-title{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;}
  .pv-conclusions{margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:6px;}
  .pv-conclusions .pv-c{padding:7px 10px 7px 14px;border-left:3px solid var(--navy);font-size:.9rem;border-radius:0 4px 4px 0;background:#F7F9FC;}
  .pv-tasks-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .pv-tasks-table th{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:2px solid var(--paper-line);}
  .pv-tasks-table td{padding:8px 8px;border-bottom:1px solid var(--paper-line);font-size:.84rem;}
  .pv-notes{font-size:.86rem;color:var(--ink-soft);white-space:pre-wrap;}
  .pv-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}

  /* ===== FORMS ===== */
  .form-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:26px 30px;max-width:760px;box-shadow:var(--shadow-sm);}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}

<script>
/* Early error catcher - runs before main script, survives parse failures */
window.onerror = function(msg, src, line, col, err){
  var app = document.getElementById('app');
  if(app) app.innerHTML =
    '<div style="padding:32px;font-family:monospace;font-size:13px;color:#A6383A;background:#FEF2F2;min-height:100vh;">' +
    '<b>Erreur JS détectée :</b><br><br>' + msg +
    '<br><br>Ligne : ' + line + ' · Colonne : ' + col +
    (err ? '<br><br><pre style="white-space:pre-wrap;">' + (err.stack||err) + '</pre>' : '') +
    '</div>';
  return true;
};
window.addEventListener('unhandledrejection', function(e){
  var app = document.getElementById('app');
  if(app && app.innerHTML.trim() === '') app.innerHTML =
    '<div style="padding:32px;font-family:monospace;font-size:13px;color:#A6383A;background:#FEF2F2;min-height:100vh;">' +
    '<b>Promise rejetée :</b><br><br>' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) +
    (e.reason && e.reason.stack ? '<br><br><pre style="white-space:pre-wrap;">' + e.reason.stack + '</pre>' : '') +
    '</div>';
});
</script>

function uid(){ return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2); }
const DONE_STATUSES = ['fait','fait (R.A.)','non réalisé'];
function setTaskStatut(task, newStatut){
  const wasDone = DONE_STATUSES.includes(task.statut);
  const becomesDone = DONE_STATUSES.includes(newStatut);
  task.statut = newStatut;
  if(becomesDone && !task.completedAt) task.completedAt = todayStr();
  if(!becomesDone) task.completedAt = null;
}
// Strip all HTML tags → plain text for card previews
function stripHtml(s){
  if(!s) return '';
  return s.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
}
function fmtText(s){
  if(!s) return '';
  if(s.includes('<') || s.includes('&')){
    // Contenteditable stores newlines as <div>...</div>
    // Convert: <div> → <br>, then remove </div>
    return s
      .replace(/<div><br\s*\/?><\/div>/gi, '<br>')  // empty line
      .replace(/<div>/gi, '<br>')                    // each div opening = line break
      .replace(/<\/div>/gi, '')                      // remove closing divs
      .replace(/^<br>/, '');                         // strip leading <br>
  }
  return escapeHtml(s).replace(/\n/g,'<br>');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const parts = iso.split('-').map(Number);
  if(parts.length<3 || !parts[1]) return iso;
  return parts[2] + ' ' + MONTHS_FR[parts[1]-1] + ' ' + parts[0];
}
function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isOverdue(task){ return task.echeance && !DONE_STATUSES.includes(task.statut) && task.echeance < todayStr(); }
function defaultData(){ return { projects: [], seances: {}, pages: {}, quickNotes: [], calendar: { rows:[], events:[] }, evolvingPV: {} }; }

function getProject(id){ return state.data.projects.find(p => p.id === id); }
function getChildren(id){ return state.data.projects.filter(p => p.parentId === id); }
function getSeances(projectId){ return state.data.seances[projectId] || []; }
function getPages(projectId){ return state.data.pages[projectId] || []; }
function sortedSeances(projectId){
  return getSeances(projectId).slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
}
function seanceIndexLabel(projectId, seanceId){
  const list = sortedSeances(projectId);
  const i = list.findIndex(s => s.id === seanceId);
  return i === -1 ? '?' : i+1;
}
function projectRef(projectId){
  const i = state.data.projects.findIndex(p => p.id === projectId);
  return 'PRJ-' + String(i+1).padStart(2,'0');
}
function getProjectPath(id){
  const p = getProject(id);
  if(!p) return '';
  if(p.parentId){
    const parent = getProject(p.parentId);
    if(parent) return parent.name + ' › ' + p.name;
  }
  return p.name;
}
function openTaskCount(projectId){
  let n = 0;
  getSeances(projectId).forEach(s => (s.taches||[]).forEach(t => { if(t.statut !== 'fait') n++; }));
  getPages(projectId).forEach(pg => (pg.taches||[]).forEach(t => { if(t.statut !== 'fait') n++; }));
  return n;
}

function getAllTasks(){
  const out = [];
  state.data.projects.forEach(p => {
    sortedSeances(p.id).forEach((s, idx) => {
      (s.taches||[]).forEach(t => {
        out.push({
          projectId: p.id, projectPath: getProjectPath(p.id), projectColor: p.color,
          origin: 'seance', originLabel: s.title || 'PV n°' + (idx+1), source: null,
          seanceId: s.id, pageId: null,
          taskId: t.id, description: t.description, responsable: t.responsable,
          echeance: t.echeance, statut: t.statut, priority: t.priority || false, priorityFrom: t.priorityFrom||null, completedAt: t.completedAt
        });
      });
    });
    getPages(p.id).forEach(pg => {
      (pg.taches||[]).forEach(t => {
        out.push({
          projectId: p.id, projectPath: getProjectPath(p.id), projectColor: p.color,
          origin: 'page', originLabel: 'Page : ' + pg.title, source: pg.source || 'manuel',
          seanceId: null, pageId: pg.id,

          echeance: t.echeance, statut: t.statut, priority: t.priority || false, priorityFrom: t.priorityFrom||null, completedAt: t.completedAt
        });
      });
    });
    // Direct project tasks
    (p.directTasks||[]).forEach(t => {
      out.push({
        projectId: p.id, projectPath: getProjectPath(p.id), projectColor: p.color,
        origin: 'direct', originLabel: '— Direct', source: null,

        });
      });
    });
  });
  return out;
}

/* ============== ONE NOTE IMPORT PARSER ============== */
function parseOneNoteText(raw){
  const lines = raw.split(/\r?\n/);
  const checkboxRegex = /^\s*(?:[-*•]\s*)?(\[x\]|\[X\]|\[\s?\]|☑|✔|✓|☐|□|❑)\s*(.+)$/;
  const doneMarkers = ['[x]','[X]','☑','✔','✓'];
  const tasks = [];
  lines.forEach(line => {
    const m = line.match(checkboxRegex);
    if(m){
      const text = m[2].trim();
      if(text){
        tasks.push({ id: uid(), description: text, responsable: '', echeance: '', statut: doneMarkers.includes(m[1]) ? 'fait' : 'à faire' });
      }
    }
  });
  return tasks;
}

function getPreparationReminders(){
  // Returns list of upcoming reminders: {event, row, reminderMonth, reminderYear}
  const year = new Date().getFullYear();
  const currentMonth = new Date().getMonth();
  const results = [];
  const cal = state.data.calendar;
  const events = cal.events.filter(e => e.reminder && e.reminder.active);

  events.forEach(ev => {
    const rem = ev.reminder;
    // Compute reminder offset in months
    let offsetMonths = rem.unit === 'semaine' ? Math.ceil(rem.amount / 4.33) : Number(rem.amount)||1;

    // Years to check: event's own year, and recurring events for current year
    const yearsToCheck = ev.recurring || rem.recurring ? [year, year+1] : [ev.year];
    yearsToCheck.forEach(evYear => {
      const offsetMonths = rem.unit === 'semaine' ? Math.ceil(rem.amount / 4.33) : Number(rem.amount)||1;
      let remMonth = ev.startMonth - offsetMonths;
      let remYear = evYear;
      // Handle wrap: if remMonth < 0, it falls in the previous year
      while(remMonth < 0){ remMonth += 12; remYear--; }

      // Only show if reminder month falls in the current month of the current year
      if(remYear === year && remMonth === currentMonth){
        const row = cal.rows.find(r=>r.id===ev.rowId);
        results.push({ event:ev, row, reminderMonth:remMonth, reminderYear:remYear,
          eventMonth:ev.startMonth, eventYear:evYear, offsetMonths,
          unit:rem.unit, amount:rem.amount });
      }
    });
  });
  return results;
}

/* ============== CALENDAR VIEW ============== */
const CAL_MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
const CAL_COLORS = [
  { key:'ec-rose',    label:'Rose' },
  { key:'ec-mauve',   label:'Mauve' },
  { key:'ec-sage',    label:'Sauge' },
  { key:'ec-blush',   label:'Blush' },
  { key:'ec-teal',    label:'Teal' },
  { key:'ec-lavender',label:'Lavande' },
  { key:'ec-peach',   label:'Pêche' },
  { key:'ec-mint',    label:'Menthe' }
];
const CAL_COLOR_BG = {
  'ec-rose':'#F2C4CA','ec-mauve':'#D4B8E0','ec-sage':'#B8D4C0',
  'ec-blush':'#F0D4C4','ec-teal':'#B4D8D4','ec-lavender':'#C8C0E0',
  'ec-peach':'#F4C8B0','ec-mint':'#B8E0D0'
};

function openCalendar(){ state.view='calendarView'; render(); }

function renderCalendar(standalone){
  const year = state.calYear;
  const cal = state.data.calendar;
  const rows = cal.rows;
  // Include events for this year OR recurring events from any year
  const events = cal.events.filter(e => e.year===year || e.recurring===true);
  const currentMonth = new Date().getFullYear()===year ? new Date().getMonth() : -1;

  const categories = [...new Set(rows.map(r=>r.category||'').filter(Boolean))];
  const uncategorized = rows.filter(r=>!r.category);
  const grouped = categories.map(cat => ({ cat, rows: rows.filter(r=>r.category===cat) }));

  function renderRow(row){
    const labelCell = '<td class="cal-row-label col-label" data-action="edit-cal-row" data-id="'+row.id+'" title="Modifier cette ligne" style="cursor:pointer;">' +
      '<div class="cal-row-label-inner">' +
        escapeHtml(row.label) +
        (row.sub ? '<span class="cal-row-label-sub">'+escapeHtml(row.sub)+'</span>' : '') +
      '</div>' +
    '</td>';

    const monthCells = CAL_MONTHS_SHORT.map((_,mi) => {
      const monthEvents = events.filter(e=>e.rowId===row.id && mi>=e.startMonth && mi<=e.endMonth);
      // Preparation period events (lighter color, striped)
      // Includes wrap-around into current year for recurring events' NEXT occurrence
      const prepEvents = events.filter(e=>{
        if(e.rowId!==row.id) return false;
        if(!(e.reminder && e.reminder.active)) return false;
        const isRecurring = e.recurring || (e.reminder && e.reminder.recurring);
        const offsetMonths = e.reminder.unit==='semaine' ? Math.ceil(e.reminder.amount/4.33) : Number(e.reminder.amount)||1;

        const remStart = e.startMonth - offsetMonths;
        const remEnd   = e.startMonth - 1;

        const notOverlap = !monthEvents.find(ev=>ev.id===e.id);

        // Case 1: prep fully within the current year
        if(remStart >= 0 && remEnd >= 0){
          return mi >= remStart && mi <= remEnd && notOverlap;
        }

        // Case 2: prep spans year boundary (remStart < 0, remEnd >= 0)
        // → Part of prep is in current year: months [0, remEnd]
        // → Part of prep was in previous year: not shown here
        // → ALSO: if recurring, next year's occurrence preps [12+remStart, 11] in current year
        if(remStart < 0 && remEnd >= 0){
          // Current year's occurrence: months 0 to remEnd (e.g. Jan for Feb event)
          if(mi >= 0 && mi <= remEnd && notOverlap) return true;
          // Next year's occurrence (recurring): wrap from year end
          if(isRecurring){
            const wrapStart = 12 + remStart; // e.g. Nov=10 for 3-month prep before Feb
            if(mi >= wrapStart && mi <= 11 && notOverlap) return true;
          }
          return false;
        }

        // Case 3: prep entirely in previous year (remEnd < 0)
        // → if recurring, next year's occurrence wraps: [12+remStart, 11]
        if(remStart < 0 && remEnd < 0){
          if(isRecurring){
            const wrapStart = 12 + remStart;
            const wrapEnd   = 12 + remEnd;
            return mi >= wrapStart && mi <= wrapEnd && notOverlap;
          }
          return false;
        }

        return false;
      });

      let cellContent = '';
      let cellStyle = '';
      let cellAction = 'data-action="add-cal-event" data-row-id="'+row.id+'" data-month="'+mi+'"';

      // Only show prep from the FIRST matching event per cell to avoid color conflicts
      const firstPrepEv = prepEvents[0] || null;
      if(firstPrepEv){
        cellContent += '<div class="cal-event cal-event-solo prep-block '+(firstPrepEv.colorClass||'ec-rose')+'" data-action="edit-cal-event" data-id="'+firstPrepEv.id+'" title="Préparation : '+escapeHtml(firstPrepEv.text||'')+'">Prép.</div>';
      }

      monthEvents.forEach(ev => {
        const isStart = ev.startMonth===mi;
        const isEnd = ev.endMonth===mi;
        const isSolo = isStart && isEnd;
        const isMid = !isStart && !isEnd;
        const bg = CAL_COLOR_BG[ev.colorClass||'ec-rose']||'#E0E0E0';

        if(isMid || isEnd){
          // Fill entire td — click to edit the event
          cellStyle = 'background:'+bg+';padding:0;cursor:pointer;';
          cellAction = 'data-action="edit-cal-event" data-id="'+ev.id+'"';
          // Empty spacer div to give the cell its height
          cellContent = '<div style="min-height:42px;height:100%;"></div>';
        } else {
          const spanClass = isSolo ? 'cal-event-solo' : 'cal-event-start';
          cellContent += '<div class="cal-event '+spanClass+' '+(ev.colorClass||'ec-rose')+'" data-action="edit-cal-event" data-id="'+ev.id+'">' +
            escapeHtml(ev.text||'') + (ev.recurring ? ' <span title="Rappel annuel" style="opacity:.7;">↻</span>' : '') +
          '</div>';
        }
      });

      if(monthEvents.length===0 && prepEvents.length===0){
        cellContent = '<div class="cal-add-hint">+</div>';
      }
      return '<td class="cal-cell'+(mi===currentMonth?' current-month-cell':'')+'" style="'+cellStyle+'" '+cellAction+'>' + cellContent + '</td>';
    }).join('');

    return '<tr>' + labelCell + monthCells + '</tr>';
  }

  let tableBody = '';
  uncategorized.forEach(r => { tableBody += renderRow(r); });
  grouped.forEach(({cat, rows:catRows}) => {
    tableBody += '<tr class="cal-category-row"><td colspan="13">'+escapeHtml(cat)+'</td></tr>';
    catRows.forEach(r => { tableBody += renderRow(r); });
  });

  const thead = '<thead><tr>' +
    '<th class="cal-th-label col-label">Activité / Projet</th>' +
    CAL_MONTHS_SHORT.map((m,i)=>'<th class="cal-th-month col-month'+(i===currentMonth?' current-month':'')+'">' + m + '</th>').join('') +
  '</tr></thead>';

  const legend = '<div class="cal-legend">' +

  '</div>';

    ? '<div class="empty-state small" style="margin-top:12px;"><p style="margin:0;">Ajoutez des lignes avec le bouton <strong>+ Ajouter une ligne</strong> pour commencer à planifier votre année.</p></div>'
    : '';

  const controls = '<div class="cal-year-bar">' +
    '<button class="cal-year-btn" data-action="cal-prev-year">← '+(year-1)+'</button>' +
    '<span class="cal-year-display">'+year+'</span>' +
    '<button class="cal-year-btn" data-action="cal-next-year">'+(year+1)+' →</button>' +
    '<button class="btn btn-primary no-print" data-action="add-cal-row" style="margin-left:10px;font-size:.78rem;padding:6px 12px;">+ Ligne</button>' +
    '<button class="btn no-print" data-action="print-pv" style="font-size:.78rem;padding:6px 12px;">Imprimer</button>' +
  '</div>';

  if(standalone){
    return '<p class="eyebrow">Planning</p>' +
      '<h1 class="page-title">Calendrier annuel</h1>' +
      '<p class="page-sub">Cliquez sur une cellule pour ajouter un événement · <strong>↻</strong> = rappel annuel automatique · Cliquez sur un intitulé de ligne pour le modifier</p>' +
      controls + legend +

      emptyHint;

  return controls + legend +

function renderDashboard(){
  const all = getAllTasks();
  if(state.data.projects.length===0){
    return '<p class="eyebrow">Vue d’ensemble</p>' +
      '<h1 class="page-title">Tableau de bord</h1>' +
      '<p class="page-sub">Toutes les tâches issues de vos projets, au même endroit.</p>' +
      '<div class="empty-state"><h3>Aucun projet encore</h3>' +
      '<p>Créez votre premier projet pour commencer à enregistrer des séances, des pages et des tâches.</p>' +
      '<button class="btn btn-primary" data-action="open-new-project">' + ICONS.plus + ' Créer un projet</button></div>';
  }

  const allVigs = [];
  state.data.projects.forEach(p => {
    (p.vigilances||[]).forEach(v => allVigs.push({ ...v, projectId:p.id, projectName:getProjectPath(p.id), projectColor:p.color }));
  });

  const openTaskCount2 = all.filter(t=>t.statut!=='fait' && t.statut!=='fait (R.A.)').length;
  const raCount = all.filter(t=>t.statut==='fait (R.A.)').length;
  const priorityCount = getPriorityTasks().length;
  const tabsHtml = '<div class="tab-row" style="margin-bottom:22px;">' +
    '<button class="tab-btn' + (state.dashboardTab==='taches'?' active':'') + '" data-action="db-tab-taches">Tâches' +
      (openTaskCount2>0 ? ' <span style="background:var(--navy);color:#fff;font-size:.65rem;font-family:var(--font-mono);padding:1px 6px;border-radius:8px;margin-left:4px;">' + openTaskCount2 + '</span>' : '') +
    '</button>' +
    '<button class="tab-btn' + (state.dashboardTab==='prioritaires'?' active':'') + '" data-action="db-tab-prioritaires">⭐ Prioritaires' +
      (priorityCount>0 ? ' <span style="background:#7A5800;color:#fff;font-size:.65rem;font-family:var(--font-mono);padding:1px 6px;border-radius:8px;margin-left:4px;">' + priorityCount + '</span>' : '') +
    '</button>' +
    '<button class="tab-btn' + (state.dashboardTab==='ra'?' active':'') + '" data-action="db-tab-ra">Rapport d\'activités</button>' +
    '<button class="tab-btn' + (state.dashboardTab==='vigilances'?' active':'') + '" data-action="db-tab-vigilances">Points de vigilance' +
      (allVigs.length>0 ? ' <span style="background:var(--seal-gold);color:#fff;font-size:.65rem;font-family:var(--font-mono);padding:1px 6px;border-radius:8px;margin-left:4px;">' + allVigs.length + '</span>' : '') +
    '</button>' +
  '</div>';

  const header = '<p class="eyebrow">Vue d’ensemble</p>' +
    '<h1 class="page-title">Tableau de bord</h1>' +
    '<p class="page-sub">Toutes les tâches et points de vigilance, tous projets confondus.</p>';

  const body = state.dashboardTab==='vigilances' ? renderVigilancesDashboard(allVigs)
    : state.dashboardTab==='ra' ? renderRaDashboard(all)
    : state.dashboardTab==='prioritaires' ? renderPrioritairesDashboard()
    : renderTasksDashboard(all);

  return header + tabsHtml + body;
}

function renderPrioritairesDashboard(){
  const tasks = getPriorityTasks().sort((a,b)=>{
    const ea=a.echeance||'9999', eb=b.echeance||'9999'; return ea.localeCompare(eb);
  });
  if(tasks.length===0) return '<div class="empty-state"><h3>Aucune tâche prioritaire</h3><p>Marquez des tâches ⭐ depuis les tableaux de tâches de chaque projet.</p></div>';
  const rows = tasks.map(t=>{
    const overdue = isOverdue(t);
    return '<tr class="'+(overdue?'is-overdue':'')+'">' +
      '<td><span class="proj-tag"><span class="swatch" style="background:'+t.projectColor+'"></span>'+escapeHtml(t.projectPath)+'</span></td>' +
      '<td class="task-desc-cell" data-action="open-edit-task" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'">' + escapeHtml(t.description) + '</td>' +
      '<td>'+(t.responsable||'—')+'</td>' +
      '<td>'+fmtDate(t.echeance)+(overdue?'<span class="overdue-flag">EN RETARD</span>':'')+'</td>' +
      '<td><select class="status-select" style="border-left:3px solid '+STATUS_COLOR[t.statut]+';color:'+STATUS_COLOR[t.statut]+';" data-field="dash-task-statut" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'">' +
        STATUS_LIST.map(s=>'<option value="'+s+'"'+(t.statut===s?' selected':'')+'>'+s+'</option>').join('') +
      '</select></td>' +
      '<td class="no-print" style="white-space:nowrap;">' +
        '<button class="priority-star on" data-action="toggle-priority" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'" title="Retirer la priorité">⭐</button>' +
        '<button class="icon-btn" data-action="open-edit-task" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'" title="Modifier">'+ICONS.edit+'</button>' +
      '</td>' +
    '</tr>';
  }).join('');
  return '<table class="ledger">' +
    '<thead><tr><th>Projet</th><th>Tâche</th><th>Responsable</th><th>Échéance</th><th>Statut</th><th class="no-print"></th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table>';
}

function renderRaDashboard(all){
  const raTasks = all.filter(t=>t.statut==='fait (R.A.)')
    .sort((a,b)=>{
      const da = a.completedAt||a.echeance||'0000', db = b.completedAt||b.echeance||'0000';
      return db.localeCompare(da);
    });

  if(raTasks.length===0){
    return '<div class="empty-state"><h3>Aucune tâche marquée \u00ab\u00a0Fait (R.A.)\u00a0\u00bb</h3>' +
      '<p>Marquez des tâches avec le statut <strong>Fait (R.A.)</strong> pour les retrouver ici et générer votre rapport d\'activités annuel.</p></div>';
  }

  const years = [...new Set(raTasks.map(t=>(t.completedAt||t.echeance||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const currentYear = new Date().getFullYear().toString();
  if(!state.raYear) state.raYear = years.includes(currentYear) ? currentYear : (years[0]||currentYear);
  const selYear = state.raYear;

  const filtered = raTasks.filter(t=>{
    if(selYear==='all') return true;
    const y = (t.completedAt||t.echeance||'').slice(0,4);
    return y===selYear;
  });

  const byProject = {};
  filtered.forEach(t=>{
    if(!byProject[t.projectPath]) byProject[t.projectPath] = { color:t.projectColor, tasks:[] };
    byProject[t.projectPath].tasks.push(t);
  });

  const yearOptions = '<option value="all">Toutes les années</option>' +
    years.map(y=>'<option value="'+y+'"'+(selYear===y?' selected':'')+'>'+y+'</option>').join('');

  const groups = Object.entries(byProject).map(([projName, grp])=>{
    const rows = grp.tasks.map(t=>
      '<tr>' +
        '<td>'+escapeHtml(t.originLabel)+'</td>' +
        '<td>'+escapeHtml(t.description)+'</td>' +
        '<td>'+(t.responsable?escapeHtml(t.responsable):'—')+'</td>' +
        '<td style="font-family:var(--font-mono);font-size:.78rem;">'+(t.completedAt?fmtDate(t.completedAt):(t.echeance?fmtDate(t.echeance):'—'))+'</td>' +
      '</tr>'
    ).join('');
    return '<div style="margin-bottom:28px;">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
        '<span style="width:10px;height:10px;border-radius:50%;background:'+grp.color+';flex-shrink:0;display:inline-block;"></span>' +
        '<span style="font-family:var(--font-display);font-weight:600;font-size:1rem;">'+escapeHtml(projName)+'</span>' +
        '<span style="font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);">\u00b7 '+grp.tasks.length+' réalisation(s)</span>' +
      '</div>' +
      '<table class="ledger"><thead><tr><th>Origine</th><th>Réalisation</th><th>Responsable</th><th>Date réalisation</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table>' +
    '</div>';
  }).join('');

  const totalCount = filtered.length;
  const projCount = Object.keys(byProject).length;
  const summaryBadge = '<div style="display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap;">' +
    '<span style="font-family:var(--font-mono);font-size:.78rem;color:#6B4C9A;background:#F3F0FF;padding:4px 10px;border-radius:4px;">' + totalCount + ' réalisation(s)</span>' +
    '<span style="font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft);background:var(--blush);padding:4px 10px;border-radius:4px;">' + projCount + ' projet(s)</span>' +
  '</div>';

  const exportBar = '<div class="ra-export-bar no-print">' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      '<span style="font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);">ANNÉE</span>' +
      '<select class="filter" data-action="ra-filter-year">' + yearOptions + '</select>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn" data-action="export-ra-excel">' + ICONS.download + ' Excel</button>' +
      '<button class="btn" data-action="export-ra-word">' + ICONS.download + ' Word</button>' +
      '<button class="btn" data-action="print-ra">' + ICONS.printer + ' Imprimer</button>' +
    '</div>' +
  '</div>';

  const printHeader = '<div class="ra-print-header">' +
    '<h2 style="font-family:var(--font-display);font-size:1.4rem;margin:0 0 4px;">Rapport d\'activités' + (selYear!=='all'?' '+selYear:'') + '</h2>' +
    '<p style="margin:0;color:var(--ink-soft);font-size:.84rem;">Généré le ' + fmtDate(todayStr()) + ' \u2014 ' + totalCount + ' réalisation(s) sur ' + projCount + ' projet(s)</p>' +
  '</div>';

  return exportBar + printHeader + summaryBadge + groups;
}

function renderVigilancesDashboard(allVigs){
  if(allVigs.length===0){
    return '<div class="empty-state"><h3>Aucun point de vigilance</h3>' +
      '<p>Ouvrez un projet et ajoutez des points de vigilance pour les retrouver ici.</p></div>';
  }
  const byProject = {};
  allVigs.forEach(v => {
    if(!byProject[v.projectId]) byProject[v.projectId] = { name:v.projectName, color:v.projectColor, items:[] };
    byProject[v.projectId].items.push(v);
  });
  const rows = allVigs.map(v =>
    '<tr>' +
      '<td><span class="proj-tag"><span class="swatch" style="background:' + v.projectColor + '"></span>' + escapeHtml(v.projectName) + '</span></td>' +
      '<td><span style="display:flex;align-items:flex-start;gap:8px;">' +
        '<span style="width:7px;height:7px;border-radius:50%;background:var(--seal-gold);flex-shrink:0;margin-top:5px;display:inline-block;"></span>' +
        escapeHtml(v.text) +
      '</span></td>' +
      '<td class="no-print"><button class="btn btn-ghost" style="font-size:.76rem;padding:4px 10px;" data-action="open-project" data-id="' + v.projectId + '">Ouvrir</button></td>' +
    '</tr>'
  );
  return '<div class="vigilance-block" style="margin-bottom:22px;">' +
      '<div class="vigilance-header">' +
        '<div class="vigilance-title">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
          allVigs.length + ' point' + (allVigs.length>1?'s':'') + ' de vigilance sur ' + Object.keys(byProject).length + ' projet' + (Object.keys(byProject).length>1?'s':'') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<table class="ledger">' +
      '<thead><tr><th>Projet</th><th>Point de vigilance</th><th class="no-print"></th></tr></thead>' +
      '<tbody>' + rows.join('') + '</tbody>' +
    '</table>';
}

function renderTasksDashboard(all){
  const total = all.length;
  const aFaire = all.filter(t=>t.statut==='à faire').length;
  const enCours = all.filter(t=>t.statut==='en cours').length;
  const fait = all.filter(t=>t.statut==='fait').length;
  const enRetard = all.filter(isOverdue).length;
  const aFaireOk = aFaire - all.filter(t=>t.statut==='à faire' && isOverdue(t)).length;
  const enCoursOk = enCours - all.filter(t=>t.statut==='en cours' && isOverdue(t)).length;

  const f = state.dashboardFilters;
  const s = state.dashSort;
  const responsables = [...new Set(all.map(t=>t.responsable).filter(Boolean))].sort();
  const projectOptions = [];
  state.data.projects.filter(p=>!p.parentId).forEach(p=>{
    projectOptions.push({ id:p.id, label:p.name });
    getChildren(p.id).forEach(c=>projectOptions.push({ id:c.id, label:'— ' + c.name }));
  });

  // Sort key → value extractor
  function sortVal(t, col){
    switch(col){
      case 'projet':      return t.projectPath.toLowerCase();
      case 'origine':     return t.originLabel.toLowerCase();
      case 'tache':       return t.description.toLowerCase();
      case 'responsable': return (t.responsable||'').toLowerCase();
      case 'echeance':    return t.echeance||'9999-99-99';
      case 'statut':      return t.statut;
      default:            return t.echeance||'9999-99-99';
    }
  }

  let rows = all.filter(t => {
    if(f.projet!=='all' && t.projectId!==f.projet) return false;
    if(f.statut!=='all' && t.statut!==f.statut) return false;
    if(f.responsable!=='all' && t.responsable!==f.responsable) return false;
    if(f.origine!=='all' && t.origin!==f.origine) return false;
    if(f.onlyOverdue && !isOverdue(t)) return false;
    return true;
  }).sort((a,b)=>{
    // Done tasks always go to the bottom
    const aDone = DONE_STATUSES.includes(a.statut) ? 1 : 0;
    const bDone = DONE_STATUSES.includes(b.statut) ? 1 : 0;
    if(aDone !== bDone) return aDone - bDone;
    // Within each group, apply the selected column sort
    const va = sortVal(a, s.col||'echeance');
    const vb = sortVal(b, s.col||'echeance');
    return va < vb ? -s.dir : va > vb ? s.dir : 0;
  });

  // Column definitions with sort keys
  const COLS = [
    { key:'projet',      label:'Projet' },
    { key:'origine',     label:'Origine' },
    { key:'tache',       label:'Tâche' },
    { key:'responsable', label:'Responsable' },
    { key:'echeance',    label:'Échéance' },
    { key:'statut',      label:'Statut' }
  ];

  function thClass(key){ return 'sortable' + (s.col===key ? (s.dir===1?' sort-asc':' sort-desc') : ''); }

  const tableHeaders = COLS.map(c =>
    '<th class="'+thClass(c.key)+'" data-action="sort-col" data-col="'+c.key+'">'+c.label+'</th>'
  ).join('') + '<th class="no-print"></th>';

  const tableBody = rows.length===0
    ? '<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:24px;">Aucune tâche ne correspond à ces filtres.</td></tr>'
    : rows.map((t, idx) => {
        const overdue = isOverdue(t);
        const isDone = DONE_STATUSES.includes(t.statut);
        const prevIsDone = idx > 0 && DONE_STATUSES.includes(rows[idx-1].statut);
        const separator = (isDone && !prevIsDone && idx > 0)
          ? '<tr><td colspan="7" style="padding:0;"><div style="display:flex;align-items:center;gap:10px;padding:7px 14px;background:#F6F9FD;border-top:2px solid var(--paper-line);border-bottom:1px solid var(--paper-line);"><span style="font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);">✓ Tâches terminées</span></div></td></tr>'
          : '';
        return separator +
          '<tr class="'+(overdue?'is-overdue':'')+'" style="'+(isDone?'opacity:.6;':'') +'">' +
          '<td><span class="proj-tag"><span class="swatch" style="background:'+t.projectColor+'"></span>'+escapeHtml(t.projectPath)+'</span></td>' +
          '<td>'+escapeHtml(t.originLabel)+(t.source==='onenote'?'<span class="source-chip">OneNote</span>':'')+'</td>' +
          '<td class="task-desc-cell" data-action="open-edit-task" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'">'+(isDone?'<span style="text-decoration:line-through;color:var(--ink-soft);">':'')+escapeHtml(t.description)+(isDone?'</span>':'')+'</td>' +
          '<td>'+(t.responsable?escapeHtml(t.responsable):'<span style="color:var(--ink-soft)">—</span>')+'</td>' +
          '<td>'+fmtDate(t.echeance)+(overdue?'<span class="overdue-flag">EN RETARD</span>':'')+'</td>' +
          '<td><select class="status-select" style="border-left:3px solid '+STATUS_COLOR[t.statut]+';color:'+STATUS_COLOR[t.statut]+';" data-field="dash-task-statut" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'">' +
            STATUS_LIST.map(ss=>'<option value="'+ss+'"'+(t.statut===ss?' selected':'')+'>'+ss+'</option>').join('') +
          '</select></td>' +
          '<td class="no-print" style="white-space:nowrap;">' +
            '<button class="priority-star'+(t.priority?' on':'')+'" data-action="toggle-priority" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'" title="'+(t.priority?(t.priorityFrom&&t.priorityFrom>todayStr()?'Planifié le '+fmtDate(t.priorityFrom)+' — clic pour retirer':'Retirer la priorité'):'Marquer comme prioritaire')+'">'+((t.priority&&t.priorityFrom&&t.priorityFrom>todayStr())?'🕐':'⭐')+'</button>' +
            '<button class="icon-btn" data-action="open-edit-task" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'" title="Modifier">'+ICONS.edit+'</button>' +
            '<button class="icon-btn" data-action="delete-task" data-task-id="'+t.taskId+'" data-project-id="'+t.projectId+'" data-origin="'+t.origin+'" data-seance-id="'+(t.seanceId||'')+'" data-page-id="'+(t.pageId||'')+'" title="Supprimer" style="color:var(--stamp-red);opacity:.6;">'+ICONS.trash+'</button>' +
          '</td>' +
        '</tr>';
      }).join('');

  function cardClass(name){ return (name==='total'&&f.statut==='all'&&!f.onlyOverdue)||(name==='overdue'&&f.onlyOverdue)||(name===f.statut&&!f.onlyOverdue)?' active':''; }

  const statusBar = total===0 ? '' :
    '<div class="status-bar">' +
      (fait?'<div class="status-bar-segment" style="width:'+(fait/total*100)+'%;background:'+STATUS_COLOR['fait']+';"></div>':'') +
      (enCoursOk?'<div class="status-bar-segment" style="width:'+(enCoursOk/total*100)+'%;background:'+STATUS_COLOR['en cours']+';"></div>':'') +
      (aFaireOk?'<div class="status-bar-segment" style="width:'+(aFaireOk/total*100)+'%;background:'+STATUS_COLOR['à faire']+';"></div>':'') +
      (enRetard?'<div class="status-bar-segment" style="width:'+(enRetard/total*100)+'%;background:var(--stamp-red);"></div>':'') +
    '</div>' +
    '<div class="status-legend">' +
      '<span class="status-legend-item" data-action="dash-filter-statut" data-value="fait"><span class="dot" style="background:'+STATUS_COLOR['fait']+'"></span>Terminées · '+fait+'</span>' +
      '<span class="status-legend-item" data-action="dash-filter-statut" data-value="en cours"><span class="dot" style="background:'+STATUS_COLOR['en cours']+'"></span>En cours · '+enCours+'</span>' +
      '<span class="status-legend-item" data-action="dash-filter-statut" data-value="à faire"><span class="dot" style="background:'+STATUS_COLOR['à faire']+'"></span>À faire · '+aFaire+'</span>' +
      (enRetard?'<span class="status-legend-item" data-action="dash-filter-overdue"><span class="dot" style="background:var(--stamp-red)"></span>En retard · '+enRetard+'</span>':'') +
    '</div>';

  return '<div class="stat-row">' +
      '<div class="stat-card'+cardClass('total')+'" data-action="dash-filter-reset"><div class="stat-num">'+total+'</div><div class="stat-label">Total</div></div>' +
      '<div class="stat-card'+cardClass('à faire')+'" data-action="dash-filter-statut" data-value="à faire"><div class="stat-num">'+aFaire+'</div><div class="stat-label">À faire</div></div>' +
      '<div class="stat-card'+cardClass('en cours')+'" data-action="dash-filter-statut" data-value="en cours"><div class="stat-num">'+enCours+'</div><div class="stat-label">En cours</div></div>' +
      '<div class="stat-card'+cardClass('fait')+'" data-action="dash-filter-statut" data-value="fait"><div class="stat-num">'+fait+'</div><div class="stat-label">Terminées</div></div>' +
      '<div class="stat-card overdue'+cardClass('overdue')+'" data-action="dash-filter-overdue"><div class="stat-num">'+enRetard+'</div><div class="stat-label">En retard</div></div>' +
    '</div>' +
    statusBar +
    '<div class="filter-row">' +
      '<select class="filter" data-action="filter-projet"><option value="all"'+(f.projet==='all'?' selected':'')+'>Tous les projets</option>'+projectOptions.map(o=>'<option value="'+o.id+'"'+(f.projet===o.id?' selected':'')+'>'+escapeHtml(o.label)+'</option>').join('')+'</select>' +
      '<select class="filter" data-action="filter-statut"><option value="all"'+(f.statut==='all'?' selected':'')+'>Tous les statuts</option>'+STATUS_LIST.map(ss=>'<option value="'+ss+'"'+(f.statut===ss?' selected':'')+'>'+ss+'</option>').join('')+'</select>' +
      '<select class="filter" data-action="filter-origine"><option value="all"'+(f.origine==='all'?' selected':'')+'>Toutes les origines</option><option value="seance"'+(f.origine==='seance'?' selected':'')+'>Séances (PV)</option><option value="page"'+(f.origine==='page'?' selected':'')+'>Pages</option></select>' +
      '<select class="filter" data-action="filter-responsable"><option value="all"'+(f.responsable==='all'?' selected':'')+'>Tous les responsables</option>'+responsables.map(r=>'<option value="'+escapeHtml(r)+'"'+(f.responsable===r?' selected':'')+'>'+escapeHtml(r)+'</option>').join('')+'</select>' +
      '<label class="filter-check"><input type="checkbox" data-action="filter-overdue"'+(f.onlyOverdue?' checked':'')+'>Uniquement en retard</label>' +
    '</div>' +
    '<table class="ledger"><thead><tr>'+tableHeaders+'</tr></thead><tbody>'+tableBody+'</tbody></table>';
}

/* ============== PROJECT VIEW ============== */
function renderProjectView(){
  const p = getProject(state.currentProjectId);
  if(!p){ state.view='dashboard'; return renderDashboard(); }

  let breadcrumb = '';
  if(p.parentId){
    const parent = getProject(p.parentId);
    if(parent){
      breadcrumb = '<p class="project-ref">SOUS-PROJET DE <button class="breadcrumb-link" data-action="open-project" data-id="'+parent.id+'">' + escapeHtml(parent.name) + '</button> · DOSSIER ' + projectRef(p.id) + '</p>';
    }
  } else {
    breadcrumb = '<p class="project-ref">DOSSIER ' + projectRef(p.id) + '</p>';
  }

  const vigilances = p.vigilances || [];
  const hasVig = vigilances.length > 0;
  const vigIcon = hasVig
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const developments = p.developments || [];
  const hasDev = developments.length > 0;
  const vigSection = '<div class="vigilance-block '+(hasVig?'has-points':'no-points')+'">' +
    '<div class="vigilance-header">' +
      '<div class="vigilance-title">' + vigIcon + '⚠ Points de vigilance</div>' +
      '<button class="btn btn-ghost no-print" data-action="add-vigilance" data-id="'+p.id+'" style="font-size:.78rem;padding:5px 10px;">' + ICONS.plus + ' Ajouter</button>' +
    '</div>' +
    (vigilances.length===0
      ? '<p class="vigilance-empty">Aucun point de vigilance — tout est en ordre.</p>'
      : '<ul class="vigilance-list">' +
          vigilances.map((v,i) =>
            '<li class="vigilance-item">' +
              '<span class="vigilance-bullet"></span>' +
              '<span class="vigilance-text">' + escapeHtml(v.text) + '</span>' +
              '<div class="vigilance-actions no-print">' +
                '<button class="icon-btn" data-action="edit-vigilance" data-id="'+p.id+'" data-idx="'+i+'" title="Modifier">' + ICONS.edit + '</button>' +
                '<button class="icon-btn" data-action="delete-vigilance" data-id="'+p.id+'" data-idx="'+i+'" title="Supprimer">' + ICONS.trash + '</button>' +
              '</div>' +
            '</li>'
          ).join('') +
        '</ul>'
    ) +
  '</div>';

  const devSection = '<div class="dev-block '+(hasDev?'has-points':'no-points')+'">' +
    '<div class="vigilance-header">' +
      '<div class="dev-title">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
        'Perspectives de d\u00e9veloppement' +
      '</div>' +
      '<button class="btn btn-ghost no-print" data-action="add-development" data-id="'+p.id+'" style="font-size:.78rem;padding:5px 10px;">' + ICONS.plus + ' Ajouter</button>' +
    '</div>' +
    (developments.length===0
      ? '<p style="color:#1A3A6A;font-size:.82rem;margin:0;">Aucune perspective de d\u00e9veloppement enregistr\u00e9e.</p>'
      : '<ul class="vigilance-list">' +
          developments.map((d,i) =>
            '<li class="vigilance-item" style="border-color:#C8DCF0;">' +
              '<span class="vigilance-bullet" style="background:var(--navy);opacity:.7;"></span>' +
              '<span class="vigilance-text">' + fmtText(d.text) + '</span>' +
              '<div class="vigilance-actions no-print">' +
                '<button class="icon-btn" data-action="edit-development" data-id="'+p.id+'" data-idx="'+i+'" title="Modifier">' + ICONS.edit + '</button>' +
                '<button class="icon-btn" data-action="delete-development" data-id="'+p.id+'" data-idx="'+i+'" title="Supprimer">' + ICONS.trash + '</button>' +
              '</div>' +
            '</li>'
          ).join('') +
        '</ul>'
    ) +
  '</div>';

  let subSection = '';
  if(!p.parentId){
    const children = getChildren(p.id);
    let grid = '';
    if(children.length){
      grid = '<div class="subproj-grid">' + children.map(c => {
        const n = openTaskCount(c.id);
        return '<div class="subproj-card" data-action="open-project" data-id="'+c.id+'">' +
          '<div class="subproj-card-top">' +
            '<span style="display:flex;align-items:flex-start;gap:6px;font-weight:500;font-size:.88rem;flex:1;min-width:0;">' +
              '<span class="swatch" style="background:'+c.color+';flex-shrink:0;margin-top:4px;"></span>' +
              '<span style="overflow-wrap:break-word;hyphens:auto;line-height:1.4;" lang="fr">'+escapeHtml(c.name)+'</span>' +
            '</span>' +
            '<div class="subproj-card-actions no-print">' +
              '<button class="icon-btn" data-action="open-edit-project" data-id="'+c.id+'" title="Modifier">' + ICONS.edit + '</button>' +
              '<button class="icon-btn" data-action="delete-project" data-id="'+c.id+'" title="Supprimer">' + ICONS.trash + '</button>' +
            '</div>' +
          '</div>' +
          '<div style="font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);">' + (n>0 ? n + ' tâche(s) ouverte(s)' : 'tout terminé') + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    subSection = '<div class="section-block">' +
      '<div class="section-heading"><h2>Sous-projets</h2>' +
        '<button class="btn btn-ghost no-print" data-action="open-new-subproject" data-id="'+p.id+'">' + ICONS.plus + ' Ajouter un sous-projet</button>' +
      '</div>' +
      (grid || '<p style="color:var(--ink-soft);font-size:.85rem;">Aucun sous-projet pour l’instant.</p>') +
    '</div>';
  }

  // Compute open task count for the badge on the tab
  const allProjTasks = getProjectTasks(p.id, true);
  const openCount = allProjTasks.filter(t=>!DONE_STATUSES.includes(t.statut)).length;
  const hasPriority = allProjTasks.some(t=>t.priority && !DONE_STATUSES.includes(t.statut));
  const children = getChildren(p.id);
  const hasChildren = children.length > 0;

  const tabsHtml = '<div class="tab-row no-print">' +
    '<button class="tab-btn' + (state.projectTab==='seances'?' active':'') + '" data-action="set-tab-seances">Séances (PV)</button>' +
    '<button class="tab-btn' + (state.projectTab==='suivi'?' active':'') + '" data-action="set-tab-suivi">↻ Suivi continu</button>' +
    '<button class="tab-btn' + (state.projectTab==='pages'?' active':'') + '" data-action="set-tab-pages">Pages</button>' +
    '<button class="tab-btn' + (state.projectTab==='taches'?' active':'') + '" data-action="set-tab-taches">Tâches' +
      (openCount>0 ? ' <span style="background:'+(hasPriority?'var(--stamp-red)':'var(--navy)')+';color:#fff;font-size:.65rem;font-family:var(--font-mono);padding:1px 6px;border-radius:8px;margin-left:4px;">'+openCount+'</span>' : '') +
    '</button>' +
  '</div>';

  const tabContent = state.projectTab==='pages' ? renderPagesTab(p)
    : state.projectTab==='taches' ? renderTachesTab(p, hasChildren)
    : state.projectTab==='suivi' ? renderEvolvingPV(p)
    : renderSeancesTab(p);

  return '<button class="btn btn-ghost no-print" data-action="open-dashboard" style="margin-bottom:18px;">' + ICONS.back + ' Tableau de bord</button>' +
    '<div class="project-header">' +
      '<div class="accent-stripe" style="background:'+p.color+'"></div>' +
      '<div class="project-header-top">' +
        '<div style="flex:1;min-width:0;">' +
          breadcrumb +
          '<h1 class="project-name">' + escapeHtml(p.name) + '</h1>' +
          ((p.contacts || p.description) ?

}

/* Return all tasks for a project (and optionally its sub-projects), enriched with origin info */
function getProjectTasks(projectId, includeChildren){
  const out = [];
  const ids = includeChildren ? [projectId, ...getChildren(projectId).map(c=>c.id)] : [projectId];
  ids.forEach(pid => {
    const proj = getProject(pid);
    const label = pid === projectId ? null : proj ? proj.name : null;
    // Direct project tasks
    (proj && proj.directTasks || []).forEach(t => {
      out.push({ ...t, _pid:pid, _subLabel:label, _origin:'— Direct', _date:proj.createdAt, _isDirect:true });
    });
    sortedSeances(pid).forEach((s, idx) => {
      (s.taches||[]).forEach(t => {
        out.push({ ...t, _pid:pid, _subLabel:label, _origin:s.title?escapeHtml(s.title):'Séance n°'+(idx+1), _date:s.date });
      });
    });
    getPages(pid).forEach(pg => {
      (pg.taches||[]).forEach(t => {
        out.push({ ...t, _pid:pid, _subLabel:label, _origin:'Page : '+pg.title, _date:pg.createdAt, _pageId:pg.id, _isPage:true });
      });
    });
    // Suivi continu (evolvingPV)
    getEPV(pid).forEach((entry, idx) => {
      (entry.taches||[]).forEach(t => {
        out.push({ ...t, _pid:pid, _subLabel:label, _origin:'Suivi : '+(entry.date||''), _date:entry.date, _epvId:entry.id, _isEpv:true });
      });
    });
  });
  return out;
}

function renderTachesTab(p, hasChildren){
  const ps = state.projSort;

  function projSortVal(t, col){
    switch(col){
      case 'origine':     return (t._origin||'').toLowerCase();
      case 'tache':       return (t.description||'').toLowerCase();
      case 'responsable': return (t.responsable||'').toLowerCase();
      case 'echeance':    return t.echeance||'9999-99-99';
      case 'statut':      return t.statut;
      default:            return t.echeance||'9999-99-99';
    }
  }

  const tasks = getProjectTasks(p.id, hasChildren)
    .sort((a,b) => {
      const aDone = DONE_STATUSES.includes(a.statut) ? 1 : 0;
      const bDone = DONE_STATUSES.includes(b.statut) ? 1 : 0;
      if(aDone !== bDone) return aDone - bDone;
      const va = projSortVal(a, ps.col||'echeance');
      const vb = projSortVal(b, ps.col||'echeance');
      return va < vb ? -ps.dir : va > vb ? ps.dir : 0;

  const aFaire = tasks.filter(t=>t.statut==='à faire').length;

  if(!s){ state.view='project'; return renderProjectView(); }
  const idx = seanceIndexLabel(p.id, s.id);
  const conclusions = (s.conclusions||[]).filter(c=>c && c.trim());
  const taches = s.taches||[];
  const participants = s.participants && s.participants.length ? s.participants.join(', ') : '—';

    const aDone=DONE_STATUSES.includes(a.statut)?1:0, bDone=DONE_STATUSES.includes(b.statut)?1:0;

          const overdue = isOverdue(t);
          const isDone = DONE_STATUSES.includes(t.statut);
          const prevDone = idx>0 && DONE_STATUSES.includes(sortedTachesSeance[idx-1].statut);
          const sep = (isDone && !prevDone && idx>0)
            ? '<tr><td colspan="4" style="padding:0;"><div style="padding:5px 8px;background:#F6F9FD;border-top:2px solid var(--paper-line);font-family:var(--font-mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);">✓ Terminées</div></td></tr>'
            : '';

/* ============== PAGE VIEW ============== */
function renderPageView(){
  const p = getProject(state.currentProjectId);
  if(!p){ state.view='dashboard'; return renderDashboard(); }
  const pg = getPages(p.id).find(x => x.id === state.currentPageId);
  if(!pg){ state.view='project'; return renderProjectView(); }
  const taches = pg.taches||[];

  const sortedTachesPage = [...taches].sort((a,b)=>{
    const aDone=DONE_STATUSES.includes(a.statut)?1:0, bDone=DONE_STATUSES.includes(b.statut)?1:0;
    if(aDone!==bDone) return aDone-bDone;
    return (a.echeance||'9999').localeCompare(b.echeance||'9999');
  });
  const tasksHtml = taches.length===0
    ? '<p class="pv-notes">Aucune tâche associée à cette page.</p>'
    : '<table class="pv-tasks-table"><thead><tr><th>Tâche</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>' +
        sortedTachesPage.map((t, idx) => {
          const overdue = isOverdue(t);
          const isDone = DONE_STATUSES.includes(t.statut);
          const prevDone = idx>0 && DONE_STATUSES.includes(sortedTachesPage[idx-1].statut);
          const sep = (isDone && !prevDone && idx>0)
            ? '<tr><td colspan="4" style="padding:0;"><div style="padding:5px 8px;background:#F6F9FD;border-top:2px solid var(--paper-line);font-family:var(--font-mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);">✓ Terminées</div></td></tr>'
            : '';
          return sep + '<tr style="'+(isDone?'opacity:.6;':'')+'"><td>'+(isDone?'<s style="color:var(--ink-soft)">':'')+escapeHtml(t.description)+(isDone?'</s>':'')+'</td>' +
            '<td>'+(t.responsable?escapeHtml(t.responsable):'—')+'</td>' +
            '<td>'+fmtDate(t.echeance)+(overdue?'<span class="overdue-flag">RETARD</span>':'')+'</td>' +
            '<td><span class="status-dot"><span class="dot" style="background:'+STATUS_COLOR[t.statut]+'"></span>'+escapeHtml(t.statut)+'</span></td></tr>';
        }).join('') +
      '</tbody></table>';

  return '<button class="btn btn-ghost no-print" data-action="back-to-pages" data-id="'+p.id+'">' + ICONS.back + ' ' + escapeHtml(p.name) + '</button>' +
    '<div class="pv-wrap" style="margin-top:18px;">' +
      '<div class="pv-document">' +
        '<div class="page-source-badge">' + (pg.source==='onenote' ? 'Importé de OneNote' : 'Page manuelle') + '</div>' +
        '<p class="pv-doctitle">Page · ' + fmtDate(pg.createdAt) + '</p>' +

        '<hr class="pv-divider">' +
        '<p class="pv-section-title">Contenu</p>' +
        '<p class="pv-notes">' + (pg.notes && pg.notes.trim() ? fmtText(pg.notes) : 'Page vide.') + '</p>' +

function attachDynamicValues(){
  // Sidebar project drag-and-drop reordering
  document.querySelectorAll('.project-tab[draggable]').forEach(btn => {
    btn.addEventListener('dragstart', e => {
      state.dragProjectId = btn.getAttribute('data-proj-id');
      btn.classList.add('drag-source');
      e.dataTransfer.effectAllowed = 'move';
    });
    btn.addEventListener('dragend', () => {
      btn.classList.remove('drag-source','drag-over-top','drag-over-bottom');
      document.querySelectorAll('.project-tab').forEach(b=>b.classList.remove('drag-over-top','drag-over-bottom'));
    });
    btn.addEventListener('dragover', e => {
      e.preventDefault();
      // Only allow drop among same-level projects
      if(!state.dragProjectId || state.dragProjectId === btn.getAttribute('data-proj-id')) return;
      const dragProj = getProject(state.dragProjectId);
      const overProj = getProject(btn.getAttribute('data-proj-id'));
      if(!dragProj || !overProj || dragProj.parentId !== overProj.parentId) return;
      document.querySelectorAll('.project-tab').forEach(b=>b.classList.remove('drag-over-top','drag-over-bottom'));
      const rect = btn.getBoundingClientRect();
      const isTop = e.clientY < rect.top + rect.height / 2;
      btn.classList.add(isTop ? 'drag-over-top' : 'drag-over-bottom');
    });
    btn.addEventListener('dragleave', () => {
      btn.classList.remove('drag-over-top','drag-over-bottom');
    });
    btn.addEventListener('drop', e => {
      e.preventDefault();
      btn.classList.remove('drag-over-top','drag-over-bottom');
      const fromId = state.dragProjectId;
      const toId = btn.getAttribute('data-proj-id');
      if(!fromId || fromId === toId) return;
      const projects = state.data.projects;
      const fromIdx = projects.findIndex(p=>p.id===fromId);
      const toIdx   = projects.findIndex(p=>p.id===toId);
      if(fromIdx < 0 || toIdx < 0) return;
      // Only reorder within same level
      if(projects[fromIdx].parentId !== projects[toIdx].parentId) return;
      const rect = btn.getBoundingClientRect();
      const insertBefore = e.clientY < rect.top + rect.height / 2;
      const [moved] = projects.splice(fromIdx, 1);
      const newToIdx = projects.findIndex(p=>p.id===toId);
      projects.splice(insertBefore ? newToIdx : newToIdx+1, 0, moved);
      state.dragProjectId = null;
      persistAndRender();
    });
  });

  // Rich text editor toolbar buttons (includes séance conclusions, epv conclusions, project fields)
  document.querySelectorAll('[data-rte]').forEach(btn => {
    btn.addEventListener('mousedown', function(e){
      e.preventDefault();
      const targetId = this.getAttribute('data-rte-target');
      const cmd = this.getAttribute('data-rte');
      const color = this.getAttribute('data-rte-color');
      const el = document.getElementById(targetId);
      if(!el) return;
      el.focus();
      if(cmd === 'highlight'){
        document.execCommand('backColor', false, color);
      } else if(cmd === 'removeFormat'){
        document.execCommand('removeFormat', false, null);
        document.execCommand('backColor', false, 'transparent');
      } else {
        document.execCommand(cmd, false, null);
      }
    });
  });
  if(state.modal && state.modal.type==='project'){
    const picker = document.getElementById('m-swatch-picker');
    if(picker){
      picker.querySelectorAll('.swatch-option').forEach(btn => {
        btn.addEventListener('click', () => {
          picker.querySelectorAll('.swatch-option').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('m-color').value = btn.getAttribute('data-color');
        });
      });
    }
  }
  if(state.modal && state.modal.type==='cal-event'){
    const picker = document.getElementById('ce-color-picker');
    if(picker){
      picker.querySelectorAll('[data-color]').forEach(btn => {
        btn.addEventListener('click', () => {
          picker.querySelectorAll('[data-color]').forEach(b=>b.style.borderColor='transparent');
          btn.style.borderColor='var(--navy)';
          document.getElementById('ce-color').value = btn.getAttribute('data-color');
        });
      });
    }
  }
  if(state.modal && state.modal.type==='cal-row'){
    const picker = document.getElementById('cr-ev-color-picker');
    if(picker){
      picker.querySelectorAll('[data-row-color]').forEach(btn => {
        btn.addEventListener('click', () => {
          picker.querySelectorAll('[data-row-color]').forEach(b=>b.style.borderColor='transparent');
          btn.style.borderColor='var(--navy)';
          document.getElementById('cr-ev-color').value = btn.getAttribute('data-row-color');
        });
      });
    }
  }
}

function collectSeanceDraft(){
  // Saves current form values into state.draftSeance before any re-render
  const d = state.draftSeance;
  if(!d) return;
  const titleEl = document.getElementById('f-title');
  if(titleEl) d.title = titleEl.value.trim();
  const dateEl = document.getElementById('f-date');
  if(dateEl) d.date = dateEl.value;
  const partEl = document.getElementById('f-participants');
  if(partEl){ d.participants = partEl.value.split(',').map(s=>s.trim()).filter(Boolean); state.draftParticipants = partEl.value; }
  const notesEl = document.getElementById('f-notes');
  if(notesEl) d.notes = (notesEl.innerHTML||notesEl.value||'').replace(/&nbsp;/g,' ').trim();
  // Collect all conclusion RTEs
  const conclusions = [];
  let ci = 0;
  while(document.getElementById('s-conclusion-'+ci)){
    const cel = document.getElementById('s-conclusion-'+ci);
    conclusions.push((cel.innerHTML||cel.value||'').replace(/&nbsp;/g,' ').trim());
    ci++;
  }
  if(conclusions.length) d.conclusions = conclusions;
}

function saveSeance(){
  const d = state.draftSeance;
  d.date = document.getElementById('f-date').value;
  d.title = (document.getElementById('f-title') && document.getElementById('f-title').value.trim()) || '';
  d.participants = document.getElementById('f-participants').value.split(',').map(s=>s.trim()).filter(Boolean);
  const fNotesEl = document.getElementById('f-notes'); d.notes = fNotesEl ? (fNotesEl.innerHTML||fNotesEl.value||'').replace(/&nbsp;/g,' ').trim() : '';

  // Collect conclusions from RTE contenteditable divs
  const collectedConclusions = [];
  let ci = 0;
  while(document.getElementById('s-conclusion-'+ci)){
    const el = document.getElementById('s-conclusion-'+ci);
    const val = (el.innerHTML||el.value||'').replace(/&nbsp;/g,' ').trim();
    if(val) collectedConclusions.push(val);
    ci++;
  }
  // Fallback: use draftSeance conclusions if no RTE divs found
  const cleanConclusions = collectedConclusions.length ? collectedConclusions : d.conclusions.map(c=>(c||'').trim()).filter(Boolean);

  const pid = state.currentProjectId;
  if(!state.data.seances[pid]) state.data.seances[pid] = [];
  let seanceId = state.currentSeanceId;
  const cleanTasks = d.taches.filter(t=>t.description && t.description.trim());

  if(seanceId){
    const s = state.data.seances[pid].find(x=>x.id===seanceId);
    Object.assign(s, { title:d.title||'', date:d.date, participants:d.participants, notes:d.notes, conclusions:cleanConclusions, taches:cleanTasks });
  } else {
    seanceId = uid();
    state.data.seances[pid].push({ id:seanceId, title:d.title||'', date:d.date, participants:d.participants, notes:d.notes, conclusions:cleanConclusions, taches:cleanTasks });
  }
  state.view='seance-view'; state.currentSeanceId=seanceId; state.draftSeance=null;
  persistAndRender();
}
